    /* While MIDI learn is armed, the next control you touch names the target. */
    wireMidiLearn() {
      NB.Midi.loadMap();
      document.addEventListener('input', (e) => {
        if (NB.Midi.learning !== 'control') return;
        const el = e.target;
        if (!el || !el.dataset || !el.dataset.midi) return;
        NB.Midi.offerControl(el);
        this.announce('Control selected — now move a knob on your controller');
        toast('Now move a knob on your controller', '', 2600);
      }, true);

      NB.bus.on('midi:learn', (s) => {
        if (s.stage === 'control') toast('MIDI learn: move a control in the app', '', 2600);
        if (s.stage === 'cc') toast(`Learn: ${s.target} — move a knob now`, '', 3200);
      });
      NB.bus.on('midi:bound', (b) => {
        if (b.cleared) { toast('MIDI mappings cleared', '', 1600); return; }
        toast(`CC ${b.cc} → ${b.target}`, 'ok', 2200);
        this.announce(`Bound controller ${b.cc} to ${b.target}`);
      });
    },

    /* ---------- tap tempo ------------------------------------------------ */
    tapTempo() {
      const now = performance.now();
      if (!this._taps) this._taps = [];
      if (this._taps.length && now - this._taps[this._taps.length - 1] > 2200) this._taps = [];
      this._taps.push(now);
      if (this._taps.length > 6) this._taps.shift();
      if (this._taps.length < 2) { toast('Tap again…', '', 900); return null; }

      const gaps = [];
      for (let i = 1; i < this._taps.length; i++) gaps.push(this._taps[i] - this._taps[i - 1]);
      const avg = gaps.reduce((a, b) => a + b, 0) / gaps.length;
      const bpm = clamp(Math.round(60000 / avg), 40, 220);
      NB.Transport.setBpm(bpm);
      this.bpmInput.value = bpm;
      this.syncLcdSub();
      NB.Persistence.saveSoon();
      return bpm;
    },

    /* ---------- busy overlay (export can take 20 s) ------------------------ */
    busy(label) {
      let box = $('#busyBox');
      if (!box) {
        box = el('div', { id: 'busyBox' });
        box.innerHTML = '<div class="busyInner"><div class="busySpin"></div><div class="busyLabel"></div><div class="busyTime"></div></div>';
        document.body.appendChild(box);
      }
      box.querySelector('.busyLabel').textContent = label;
      box.classList.add('on');
      const t0 = performance.now();
      const time = box.querySelector('.busyTime');
      const tick = setInterval(() => {
        time.textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' s';
      }, 100);
      return () => { clearInterval(tick); box.classList.remove('on'); };
    },

    /* ---------- input recording ------------------------------------------- */
    wireRecorder() {
      const btn = $('#btnRecord');
      if (!btn) return;
      const paint = (state, seconds) => {
        btn.classList.toggle('rec', state === 'recording');
        btn.textContent = state === 'recording'
          ? `● Recording ${(seconds || 0).toFixed(0)}s — stop`
          : '⏺ Record input';
      };
      let timer = 0;
      NB.bus.on('record', (e) => {
        clearInterval(timer);
        paint(e.state, e.seconds);
        if (e.state === 'recording') {
          timer = setInterval(() => paint('recording', NB.Recorder.seconds()), 500);
        }
        if (e.state === 'RecordingStopped' || e.state === 'idle') paint('idle');
      });

      btn.addEventListener('click', async () => {
        if (!NB.Recorder.supported) { toast('This browser has no MediaRecorder', 'warn', 2600); return; }
        if (!NB.Recorder.active) {
          const ok = await NB.Recorder.start();
          if (!ok) toast(`Microphone ${NB.Recorder.error || 'unavailable'}`, 'warn', 3000);
          return;
        }
        const sample = await NB.Recorder.stop();
        if (sample) toast(`${sample.name} added to the pads`, 'ok', 2400);
        else toast('Nothing recorded', 'warn', 2000);
      });
    },

    /* ---------- scenes ---------------------------------------------------- */
    wireScenes() {
      this.sceneBar = $('#sceneBar');
      NB.bus.on('scenes', () => this.renderScenes());
      NB.bus.on('project:replaced', () => this.renderScenes());
      this.renderScenes();
    },

    renderScenes() {
      const bar = this.sceneBar || $('#sceneBar');
      if (!bar) return;
      const list = NB.Scenes.list();
      bar.innerHTML = '';
      if (!list.length) {
        const hint = el('span', { class: 'empty', text: 'Scenes: save the current arrangement to switch between sections live' });
        bar.appendChild(hint);
      }
      list.forEach((sc) => {
        const chip = el('button', { class: 'sceneChip', title: `${sc.name} — click to launch, alt-click to delete, double-click to rename` });
        chip.innerHTML = `<span>${escapeHtml(sc.name)}</span><b>${sc.bpm}</b>`;
        chip.addEventListener('click', (e) => {
          if (e.altKey || e.metaKey) {
            NB.Scenes.remove(sc.id);
            toast('Scene deleted', '', 1400);
            return;
          }
          NB.Scenes.launch(sc.id);
          $$('.sceneChip', bar).forEach((c) => c.classList.remove('active'));
          chip.classList.add('active');
        });
        chip.addEventListener('dblclick', () => {
          const name = prompt('Scene name', sc.name);
          if (name) NB.Scenes.rename(sc.id, name.trim().slice(0, 24));
        });
        let hold = 0;
        chip.addEventListener('pointerdown', () => { hold = setTimeout(() => { NB.Scenes.remove(sc.id); toast('Scene deleted', '', 1400); }, 700); });
        chip.addEventListener('pointerup', () => clearTimeout(hold));
        chip.addEventListener('pointerleave', () => clearTimeout(hold));
        bar.appendChild(chip);
      });

      const add = el('button', { class: 'sceneAdd', text: '+ Save scene' });
      add.addEventListener('click', () => {
        const name = prompt('Scene name', `Scene ${list.length + 1}`);
        if (name === null) return;
        NB.Scenes.capture(name.trim().slice(0, 24) || `Scene ${list.length + 1}`);
        toast('Scene saved', 'ok', 1600);
      });
      bar.appendChild(add);
    },

    /* ---------- appearance ---------- */
    openSettings() {
      const root = document.documentElement;
      this.sheet(`
        <h4>Appearance</h4>
        <div class="sheetRow"><label>Palette</label>
          <div class="segmented" id="setPalette">
            <button data-pal="neon" class="${root.dataset.palette !== 'safe' ? 'on' : ''}">Neon</button>
            <button data-pal="safe" class="${root.dataset.palette === 'safe' ? 'on' : ''}">Colour-safe</button>
          </div></div>
        <div class="sheetRow"><label>Text size</label>
          <div class="segmented" id="setText">
            <button data-size="normal" class="${root.dataset.textsize !== 'large' ? 'on' : ''}">Normal</button>
            <button data-size="large" class="${root.dataset.textsize === 'large' ? 'on' : ''}">Larger</button>
          </div></div>
        <div class="sheetRow"><label>MIDI in</label>
          <span style="font-size:11.5px;color:var(--ink-2);flex:1" id="setMidiStatus">${escapeHtml(NB.Midi.status())}</span>
          <button class="btn" id="setMidi">${NB.Midi.ready ? 'Rescan' : 'Enable'}</button></div>
        <div class="sheetRow"><label>MIDI learn</label>
          <span style="font-size:11.5px;color:var(--ink-2);flex:1" id="setCcCount">${Object.keys(NB.Midi.ccMap).length} mapped</span>
          <button class="btn" id="setLearn">Learn</button>
          <button class="btn" id="setClearCc">Clear</button></div>
        <div class="sheetRow"><label>Motion</label>
          <span style="font-size:11px;color:var(--ink-2)">Follows your system reduced-motion setting.</span></div>
        <div class="sheetBtns">
          <button class="btn" id="setTpl">Templates…</button>
          <button class="btn" id="setPack">Load sample pack</button>
        </div>`, true);
      const s = $('#sheet');
      $$('#setPalette button', s).forEach((b) => b.addEventListener('click', () => {
        root.dataset.palette = b.dataset.pal;
        $$('#setPalette button', s).forEach((x) => x.classList.toggle('on', x === b));
        localStorage.setItem('nb-palette', b.dataset.pal);
        NB.util.applyPaletteToProject(NB.Project);
        NB.bus.emit('project:replaced');
        NB.Timeline.rebuildHeaders(); NB.Mixer.render();
      }));
      $$('#setText button', s).forEach((b) => b.addEventListener('click', () => {
        root.dataset.textsize = b.dataset.size;
        $$('#setText button', s).forEach((x) => x.classList.toggle('on', x === b));
        localStorage.setItem('nb-textsize', b.dataset.size);
        requestAnimationFrame(() => NB.Timeline.resize());
      }));
      $('#setMidi', s).addEventListener('click', async (e) => {
        e.currentTarget.disabled = true;
        const ok = await NB.Midi.enable();
        $('#setMidiStatus', s).textContent = NB.Midi.status();
        e.currentTarget.disabled = false;
        e.currentTarget.textContent = 'Rescan';
        toast(ok ? `MIDI ready — ${NB.Midi.status()}` : `MIDI ${NB.Midi.status()}`, ok ? 'ok' : 'warn', 2600);
      });
      $('#setLearn', s).addEventListener('click', () => {
        this.closeSheet();
        NB.Midi.beginLearn();
      });
      $('#setClearCc', s).addEventListener('click', () => {
        NB.Midi.clearMap();
        $('#setCcCount', s).textContent = '0 mapped';
      });
      $('#setTpl', s).addEventListener('click', () => { this.closeSheet(); this.openTemplates(); });
      $('#setPack', s).addEventListener('click', () => { this.closeSheet(); this.loadPackFile(); });
    },

    loadDemo() {
      NB.History.push('Load demo');
      NB.project.buildDemo();
      NB.Engine.ensureTrackBuses(NB.Project.tracks.length);
      NB.Engine.applyMix(NB.Project.tracks);
      $('#bpm').value = NB.Project.bpm;
      NB.bus.emit('project:replaced');
      NB.Timeline.zoomFit();
      NB.Persistence.saveSoon();
      this.syncLoopBtn();
      toast('Demo beat loaded — press space', 'ok', 2600);
    },

    addTrack() {
      if (NB.Project.tracks.length >= 24) { toast('24 tracks is the practical limit', 'warn'); return; }
      NB.History.push('Add track');
      const t = NB.project.addTrack();
      NB.Engine.ensureTrackBuses(NB.Project.tracks.length);
      NB.Engine.applyMix(NB.Project.tracks);
      NB.Timeline.selectedTrackId = t.id;
      NB.bus.emit('project:replaced');
      NB.Mixer.render();
      NB.Persistence.saveSoon();
      toast('Track added', '', 1200);
    },

    removeTrack(id) {
      if (NB.Project.tracks.length <= 1) { toast('Keep at least one track', 'warn'); return; }
      NB.History.push('Remove track');
      NB.project.removeTrack(id);
      NB.Engine.ensureTrackBuses(NB.Project.tracks.length);
      NB.Engine.applyMix(NB.Project.tracks);
      NB.bus.emit('project:replaced');
      NB.Mixer.render();
      NB.Transport.refresh();
      NB.Persistence.saveSoon();
    },

    saveProjectFile() {
      const blob = new Blob([JSON.stringify(NB.project.projectFile(), null, 2)], { type: 'application/json' });
      NB.Wav.download(blob, `${slug(NB.Project.name)}.neonboom.json`);
      toast('Project file saved', 'ok', 1600);
    },

    openProjectFile() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.addEventListener('change', async () => {
        const file = input.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          NB.History.push();
          NB.project.loadProjectFile(text, NB.Engine);
          NB.Engine.ensureTrackBuses(NB.Project.tracks.length);
          NB.Engine.applyMix(NB.Project.tracks);
          $('#bpm').value = NB.Project.bpm;
          NB.bus.emit('project:replaced');
          NB.Timeline.zoomFit();
          NB.Persistence.saveSoon();
          toast('Project loaded', 'ok');
        } catch (e) {
          toast('Could not read that project file', 'err');
        }
      });
      input.click();
    },

    async exportWav(loopOnly) {
      const btn = $('#btnExport');
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'Rendering…';
      const t0 = performance.now();
      try {
        const { rendered, seconds } = await NB.Wav.renderArrangement({
          loopOnly: !!loopOnly,
          sampleLibrary: NB.Library.items,
          project: NB.Project,
          engine: NB.Engine,
          fx: NB.Fx.snapshot(),
        });
        const blob = NB.Wav.encodeWAV(rendered);
        const suffix = loopOnly ? '-loop' : '';
        NB.Wav.download(blob, `${slug(NB.Project.name)}${suffix}-${NB.Project.bpm}bpm.wav`);
        toast(`Rendered ${fmtSec(seconds)} of audio in ${((performance.now() - t0) / 1000).toFixed(1)}s`, 'ok', 3200);
      } catch (err) {
        console.error(err);
        toast('Export failed: ' + err.message, 'err', 4000);
      } finally {
        btn.disabled = false;
        btn.innerHTML = label;
      }
    },

    async exportStems() {
      const end = this.busy('Rendering one WAV per track');
      const btn = $('#btnExport');
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'Rendering…';
      const t0 = performance.now();
      try {
        const stems = await NB.Wav.renderStems({
          sampleLibrary: NB.Library.items,
          project: NB.Project,
          engine: NB.Engine,
          fx: NB.Fx.snapshot(),
        });
        if (!stems.length) { toast('No clips to render', 'warn'); return; }
        const zip = await NB.Wav.zip(stems.map((s) => ({ name: s.name, blob: s.blob })));
        NB.Wav.download(zip, `${slug(NB.Project.name)}-stems.zip`);
        toast(`${stems.length} stems in ${((performance.now() - t0) / 1000).toFixed(1)}s`, 'ok', 3200);
      } catch (err) {
        console.error(err);
        toast('Stem export failed: ' + err.message, 'err', 4000);
      } finally {
        end();
        btn.disabled = false;
        btn.innerHTML = label;
      }
    },

    /* ---------- clip editor -------------------------------------------------
       Non-destructive: it moves the trim handles, the clip gain and the pitch,
       never the sample buffer. Undo covers all of it. */
    openClipEditor(clipId) {
      const f = NB.project.findClip(clipId);
      if (!f) return;
      const { clip } = f;
      const sample = NB.Library.get(clip.sampleId);
      if (!sample) return;
      const total = sample.beats * 4;                       // sixteenths in the sample
      const len = clip.trimEndSix - clip.trimStartSix;

      this.sheet(`
        <h4>${escapeHtml(sample.name)}</h4>
        <canvas id="ceWave" width="1120" height="200"
          style="width:100%;height:110px;background:#07090b;border:1px solid var(--line);border-radius:8px;touch-action:none"></canvas>
        <div class="sheetRow"><label>Start</label>
          <span class="val" id="ceIn" style="width:64px">${clip.trimStartSix}</span>
          <label style="flex:0 0 34px">End</label>
          <span class="val" id="ceOut" style="width:64px">${clip.trimEndSix}</span>
          <span style="font-size:11px;color:var(--ink-2);margin-left:auto">of ${total}</span></div>
        <div class="sheetRow"><label>Gain</label>
          <input type="range" id="ceGain" min="0" max="2" step="0.01" value="${clip.gain == null ? 1 : clip.gain}">
          <span class="val" id="ceGainVal">${Math.round((clip.gain == null ? 1 : clip.gain) * 100)}%</span></div>
        <div class="sheetBtns">
          <button class="btn" id="ceNorm">Normalise</button>
          <button class="btn" id="ceFit1">Fit 1 bar</button>
          <button class="btn" id="ceFit2">Fit 2 bars</button>
          <button class="btn" id="ceHalf">Half length</button>
          <button class="btn" id="ceReset">Reset trim</button>
          <button class="btn primary" id="ceDone">Done</button>
        </div>`, true);

      const s = $('#sheet');
      const canvas = $('#ceWave', s);
      const ctx2 = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(canvas.clientWidth * dpr) || 1120;
      canvas.height = Math.round(110 * dpr);
      ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
      const W = canvas.width / dpr, H = canvas.height / dpr;

      const draw = () => {
        ctx2.clearRect(0, 0, W, H);
        const peaks = sample.peaks;
        const mid = H / 2;
        for (let x = 0; x < W; x++) {
          const v = peaks[Math.floor((x / W) * peaks.length)] || 0;
          const bh = Math.max(1, v * (H * 0.42));
          const inTrim = (x / W) * total >= clip.trimStartSix && (x / W) * total <= clip.trimEndSix;
          ctx2.fillStyle = inTrim ? '#ffb020' : 'rgba(120,132,148,.35)';
          ctx2.fillRect(x, mid - bh, 1, bh * 2);
        }
        /* handles */
        const hx = (clip.trimStartSix / total) * W;
        const hx2 = (clip.trimEndSix / total) * W;
        ctx2.fillStyle = 'rgba(255,176,32,.16)';
        ctx2.fillRect(hx, 0, hx2 - hx, H);
        ctx2.fillStyle = '#ffb020';
        ctx2.fillRect(hx - 2, 0, 4, H);
        ctx2.fillRect(hx2 - 2, 0, 4, H);
        $('#ceIn', s).textContent = clip.trimStartSix;
        $('#ceOut', s).textContent = clip.trimEndSix;
      };
      draw();

      /* drag either handle */
      let dragEdge = null;
      const sixAt = (ev) => {
        const r = canvas.getBoundingClientRect();
        const x = Math.max(0, Math.min(r.width, ev.clientX - r.left));
        const six = Math.round((x / r.width) * total);
        return Math.max(0, Math.min(total, six));
      };
      canvas.addEventListener('pointerdown', (ev) => {
        canvas.setPointerCapture(ev.pointerId);
        const six = sixAt(ev);
        dragEdge = Math.abs(six - clip.trimStartSix) < Math.abs(six - clip.trimEndSix) ? 'in' : 'out';
        NB.History.push('Trim clip');
        apply(six);
      });
      canvas.addEventListener('pointermove', (ev) => { if (dragEdge) apply(sixAt(ev)); });
      canvas.addEventListener('pointerup', () => { dragEdge = null; });

      const apply = (six) => {
        if (dragEdge === 'in') clip.trimStartSix = Math.min(six, clip.trimEndSix - 1);
        if (dragEdge === 'out') clip.trimEndSix = Math.max(six, clip.trimStartSix + 1);
        draw();
        NB.Timeline.draw();
      };

      const commit = () => { NB.Transport.refresh(); NB.Persistence.saveSoon(); };

      $('#ceGain', s).addEventListener('input', (e) => {
        clip.gain = parseFloat(e.target.value);
        $('#ceGainVal', s).textContent = Math.round(clip.gain * 100) + '%';
      });
      $('#ceGain', s).addEventListener('change', commit);

      $('#ceNorm', s).addEventListener('click', () => {
        let peak = 0;
        for (let i = 0; i < sample.peaks.length; i++) peak = Math.max(peak, sample.peaks[i]);
        if (peak <= 0.001) return;
        NB.History.push('Normalise clip');
        clip.gain = Math.min(2, Math.round((0.95 / peak) * 100) / 100);
        $('#ceGain', s).value = clip.gain;
        $('#ceGainVal', s).textContent = Math.round(clip.gain * 100) + '%';
        commit();
        toast('Normalised to ' + Math.round(clip.gain * 100) + '%', 'ok', 1400);
      });

      const fitBars = (bars) => {
        NB.History.push(`Fit ${bars} bar${bars > 1 ? 's' : ''}`);
        clip.trimStartSix = 0;
        clip.trimEndSix = Math.max(1, Math.min(total, bars * 16));
        draw(); NB.Timeline.draw(); commit();
      };
      $('#ceFit1', s).addEventListener('click', () => fitBars(1));
      $('#ceFit2', s).addEventListener('click', () => fitBars(2));
      $('#ceHalf', s).addEventListener('click', () => {
        NB.History.push('Halve clip');
        clip.trimEndSix = Math.max(clip.trimStartSix + 1, Math.round((clip.trimStartSix + clip.trimEndSix) / 2));
        draw(); NB.Timeline.draw(); commit();
      });
      $('#ceReset', s).addEventListener('click', () => {
        NB.History.push('Reset trim');
        clip.trimStartSix = 0; clip.trimEndSix = total;
        draw(); NB.Timeline.draw(); commit();
      });
      $('#ceDone', s).addEventListener('click', () => this.closeSheet());
    },

    /* Optional side pack: fetch it when hosted, pick it when not. */
    async loadPackFile() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.zip,application/zip';
      input.addEventListener('change', async () => {
        const file = input.files[0];
        if (!file) return;
        toast('Reading pack…', '', 1400);
        try {
          const n = await NB.LoopPack.fromFile(file, NB.Engine);
          if (!n) { toast('No usable loops in that zip', 'warn', 3000); return; }
          NB.bus.emit('library:changed');
          NB.Pads.render();
          toast(`${n} loops installed from the pack`, 'ok', 2600);
        } catch (err) {
          console.error(err);
          toast('Could not read that pack: ' + err.message, 'err', 4000);
        }
      });
      input.click();
    },

    /* ----------------------------------------------------------- keyboard */
    wireKeyboard() {
      document.addEventListener('keydown', (e) => {
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) return;
        const mod = e.ctrlKey || e.metaKey;

        if (mod && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? NB.History.redo() : NB.History.undo(); return; }
        if (mod && e.code === 'KeyY') { e.preventDefault(); NB.History.redo(); return; }
        if (mod && e.code === 'KeyD') { e.preventDefault(); NB.Timeline.duplicateSelected(); return; }
        if (mod && e.code === 'KeyC') { e.preventDefault(); NB.Timeline.copySelected(); return; }
        if (mod && e.code === 'KeyX') { e.preventDefault(); NB.Timeline.cutSelected(); return; }
        if (mod && e.code === 'KeyV') { e.preventDefault(); NB.Timeline.paste(); return; }
        if (!mod && !e.shiftKey && e.code === 'KeyT') { e.preventDefault(); const b = this.tapTempo(); if (b) toast(`${b} BPM`, 'ok', 1000); return; }
        if (mod && e.shiftKey && e.code === 'KeyC') { e.preventDefault(); NB.Timeline.copyAutomation(); return; }
        if (mod && e.shiftKey && e.code === 'KeyV') { e.preventDefault(); NB.Timeline.pasteAutomation(); return; }
        /* shift+1..8 launches a scene — 1..0/QW are pad auditions */
        if (e.shiftKey && !mod && /^Digit[1-8]$/.test(e.code)) {
          const list = NB.Scenes.list();
          const scene = list[parseInt(e.code.slice(5), 10) - 1];
          if (scene) { e.preventDefault(); NB.Scenes.launch(scene.id); return; }
        }
        if (mod && e.code === 'KeyS') { e.preventDefault(); this.saveProjectFile(); return; }
        if (mod) return;

        switch (e.code) {
          case 'Space': e.preventDefault(); NB.Transport.toggle(); break;
          case 'KeyR': e.preventDefault(); NB.Transport.rewind(); break;
          case 'KeyL': e.preventDefault(); $('#btnLoop').click(); break;
          case 'KeyK': e.preventDefault(); $('#btnMetro').click(); break;
          case 'KeyS': e.preventDefault(); NB.Timeline.splitAtPlayhead(); break;
          case 'Delete': case 'Backspace': e.preventDefault(); NB.Timeline.deleteSelected(); break;
          case 'KeyQ': e.preventDefault(); NB.Timeline.quantize(); break;
          case 'KeyF': e.preventDefault(); NB.Timeline.zoomFit(); break;
          case 'KeyM': {
            e.preventDefault();
            const id = NB.Timeline.selectedTrackId;
            const t = NB.Project.tracks.find((x) => x.id === id) || NB.Project.tracks[0];
            if (t) { t.mute = !t.mute; NB.Engine.applyMix(NB.Project.tracks); NB.Timeline.rebuildHeaders(); NB.Mixer.render(); }
            break;
          }
          case 'ArrowLeft': e.preventDefault(); NB.Timeline.nudge(e.shiftKey ? -4 : -NB.Project.snap); break;
          case 'ArrowRight': e.preventDefault(); NB.Timeline.nudge(e.shiftKey ? 4 : NB.Project.snap); break;
          case 'Minus': case 'NumpadSubtract': NB.Timeline.zoomOut(); break;
          case 'Equal': case 'NumpadAdd': NB.Timeline.zoomIn(); break;
          case 'Escape': this.closeSheet(); break;
          default: {
            const key = e.key.toLowerCase();
            if (/^[0-9qw]$/.test(key)) NB.Pads.keyPress(key);
          }
        }
      });
    },

    /* ------------------------------------------------------------- install */
    wireInstall() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        this._installEvent = e;
        const b = $('#btnInstall');
        if (b) { b.hidden = false; b.addEventListener('click', () => { e.prompt(); b.hidden = true; }); }
      });
      /* The manifest is only attached over http(s): fetching it from file://
         is a guaranteed CORS console error for anyone who double-clicks the
         downloaded file, and it buys nothing there. */
      if (location.protocol.startsWith('http')) {
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = 'manifest.webmanifest';
        document.head.appendChild(link);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        }
      }
    },
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  NB.Shell = Shell;
})(window.NB = window.NB || {});

</script>
<script>
/* =========================================================================
   NEONBOOM · app.js
   Boot sequence: engine → synthesise the loop library (parallel) → mount UI
   → restore autosave (or load the demo on first run) → reveal.
   ========================================================================= */
(function (NB) {
  'use strict';
  const { $, toast } = NB.util;

  const LOOP_MANIFEST = [
    /* name, category, generator — order is stable so saved projects keep
       resolving to the same samples across versions */
    ['Boom Bap Kick', 'Drums', 'boomBapKick'],
    ['Snare + Clap', 'Drums', 'boomBapSnareClap'],
    ['Hi-Hat Roll', 'Drums', 'hatRoll'],
    ['808 Slide Bass', 'Bass', 'bassline808'],
    ['Synth Stab Chord', 'Synths', 'stabLoop'],
    ['Vinyl Scratch Hit', 'Scratch & FX', 'scratchOneShot'],
    ['Crash Accent', 'Scratch & FX', 'crashOneShot'],
    ['Trap Kick Pattern', 'Drums', 'trapKickPattern'],
    ['Four-on-Floor Kick', 'Drums', 'fourOnFloorKick'],
    ['Trap Snare + Ghosts', 'Drums', 'trapSnareGhosts'],
    ['Rimshot Pattern', 'Drums', 'rimshotPattern'],
    ['Trap Hat Rolls (32nd)', 'Drums', 'trapHatRolls'],
    ['Shaker Loop', 'Drums', 'shakerLoop'],
    ['Cowbell Pattern', 'Drums', 'cowbellPattern'],
    ['Tom Fill', 'Drums', 'tomFill'],
    ['Ride Cymbal Loop', 'Drums', 'rideLoop'],
    ['Sub Bass Drone', 'Bass', 'subBassDrone'],
    ['Trap 808 Pattern', 'Bass', 'trap808Pattern'],
    ['Arp Pluck Loop', 'Synths', 'arpPluckLoop'],
    ['Pad Swell', 'Synths', 'padSwell'],
    ['Bell Melody', 'Synths', 'bellMelody'],
    ['Scratch Loop', 'Scratch & FX', 'scratchLoopPattern'],
    ['Riser FX', 'Scratch & FX', 'riserFx'],
    ['Impact Hit', 'Scratch & FX', 'impactOneShot'],
    ['Vinyl Crackle Bed', 'Scratch & FX', 'vinylCrackle'],
    ['Boom Bap Full Loop', 'Drums', 'boomBapFull'],
    ['Dub Chord', 'Synths', 'dubChord'],
  ];

  const App = {
    version: '2.6.0',

    async boot() {
      const bar = $('#bootBar'), msg = $('#bootMsg');
      const set = (pct, text) => {
        bar.style.width = pct + '%';
        if (text) msg.textContent = text;
      };

      const T = { start: performance.now() };
      const mark = (k) => { T[k] = Math.round(performance.now() - T.start); };
      let hydrated = 0;
      set(4, 'starting audio engine…');
      NB.Engine = new NB.AudioEngine();
      const E = NB.Engine;
      await E.init();                       // registers the AudioWorklet module

      mark('engine');

      /* ---------- which loops matter first ----------
         The demo beat and the first screenful of pads only need these. They are
         hydrated from cache (or synthesised) before the veil lifts; everything
         else arrives in the background. */
      const PRIORITY = new Set(['boomBapKick', 'boomBapSnareClap', 'hatRoll', 'bassline808',
        'stabLoop', 'arpPluckLoop', 'vinylCrackle', 'crashOneShot',
        'scratchOneShot', 'trapKickPattern', 'fourOnFloorKick', 'trapSnareGhosts',
        'rimshotPattern', 'trapHatRolls']);

      const idOf = (fn) => 'loop_' + fn;
      const register = (name, category, fn, i, buffer, beats) => {
        NB.Library.register({
          id: idOf(fn), name, buffer, category,
          color: NB.util.TRACK_COLORS[i % NB.util.TRACK_COLORS.length],
          beats,
        });
      };
      const hydrateRows = (rows) => {
        let n = 0;
        LOOP_MANIFEST.forEach(([name, category, fn], i) => {
          if (NB.Library.has(idOf(fn))) return;
          const row = rows.get(NB.LoopCache.key(idOf(fn)));
          if (!row) return;
          try {
            register(name, category, fn, i, NB.LoopCache.hydrate(row, E.ctx), row.beats);
            n++;
          } catch (err) { /* corrupt row: it will be re-synthesised */ }
        });
        return n;
      };

      const renderOne = async ([name, category, fn], i) => {
        if (NB.Library.has(idOf(fn))) return;
        try {
          const { buffer, beats } = await NB.Synth[fn].call(NB.Synth);
          register(name, category, fn, i, buffer, beats);
          NB.LoopCache.put(idOf(fn), buffer, beats);   // fire and forget
        } catch (err) {
          console.error('loop failed:', name, err);
        }
      };

      const runQueue = async (queue, workers) => {
        const q = queue.slice();
        await Promise.all(Array.from({ length: workers }, async () => {
          while (q.length) {
            const [entry, i] = q.shift();
            await renderOne(entry, i);
            done++;
            set(12 + (done / Math.max(1, totalPending)) * 72, `synthesising ${entry[0]}…`);
          }
        }));
      };

      const allEntries = LOOP_MANIFEST.map((entry, i) => [entry, i]);
      let done = 0;
      let totalPending = 0;

      /* ---------- storage, then the priority slice ---------- */
      set(8, 'restoring rendered loops…');
      try {
        await NB.Persistence.open();
        const priorityNames = LOOP_MANIFEST
          .filter(([, , fn]) => PRIORITY.has(fn))
          .map(([, , fn]) => idOf(fn));
        const rows = await NB.LoopCache.many(priorityNames);
        hydrated = hydrateRows(rows);
      } catch (err) {
        console.warn('storage unavailable — loops will render every boot', err);
      }
      mark('storage');

      /* ---------- the optional side pack sits between cache and synth ----------
         It is only pulled automatically when the pack ships *with* the app
         (a <meta> the desktop/Android build injects) or when the URL asks for
         it. Auto-downloading 7 MB on the open web would be slower than just
         synthesising, so the web default is the "Load pack…" button. */
      const packLocal = !!document.querySelector('meta[name="neonboom-pack-local"]');
      const packAsked = new URLSearchParams(location.search).has('pack');
      if ((packLocal || packAsked) && !NB.Library.has(idOf('boomBapKick'))) {
        set(10, 'loading the bundled sample pack…');
        const got = await NB.LoopPack.tryAtBoot(E, packLocal ? 6000 : 2500);
        if (got > 0) {
          hydrated = got;
          set(12, `${got} loops from the pack`);
        } else if (got === -1) {
          NB.LoopPack.load(E).then((n) => { if (n) { NB.bus.emit('library:changed'); NB.Pads.render(); } });
        }
      }
      mark('packMs');

      const phase1 = allEntries.filter(([e]) => PRIORITY.has(e[2]) && !NB.Library.has(idOf(e[2])));
      const phase2 = allEntries.filter(([e]) => !PRIORITY.has(e[2]) && !NB.Library.has(idOf(e[2])));
      totalPending = phase1.length + phase2.length;

      if (hydrated) set(12, `${hydrated} loops restored from cache`);
      await runQueue(phase1, 6);
      mark('phase1');
      Object.assign(T, { hydrated, pack: NB.LoopPack.lastResult, packMs: T.packMs, phase1: phase1.length, phase2: phase2.length });
      App.timings = T;   // live reference: later marks keep landing in it

      /* ---------- project + UI ---------- */
      set(86, 'building the workspace…');
      NB.project.initTracks(8);
      E.ensureTrackBuses(NB.Project.tracks.length);

      NB.Timeline.init();
      NB.Pads.init();
      NB.Mixer.mount($('#drawerBody'));
      NB.Fx.mount(document.createElement('div'));
      NB.Inspector.mount($('#inspector'));
      NB.Shell.init();
      mark('ui');

      /* ---------- restore ---------- */
      set(94, 'looking for your last session…');
      let restored = false;
      try {
        restored = await NB.Persistence.load(E);
      } catch (err) {
        console.warn('storage unavailable — autosave off', err);
      }

      if (restored) {
        if (NB.Project.fx) { Object.assign(NB.Fx.values, NB.Project.fx); NB.Fx.render(); }
        E.ensureTrackBuses(NB.Project.tracks.length);
        E.applyMix(NB.Project.tracks);
        $('#bpm').value = NB.Project.bpm;
        NB.bus.emit('project:replaced');
        NB.bus.emit('library:changed');
        NB.Timeline.zoomFit();
      } else {
        NB.project.buildDemo();
        E.ensureTrackBuses(NB.Project.tracks.length);
        E.applyMix(NB.Project.tracks);
        $('#bpm').value = NB.Project.bpm;
        NB.bus.emit('project:replaced');
        NB.Timeline.zoomFit();
        setTimeout(() => toast('Demo beat loaded — press space to play', 'ok', 3600), 700);
      }

      mark('restore');
      NB.Shell.syncLoopBtn();
      NB.Shell.openDrawer('mixer');
      NB.Shell.maybeOnboard();

      /* ---------- the rest of the library, after the veil lifts ---------- */
      if (phase2.length) {
        setTimeout(async () => {
          let more = 0;
          try { more = hydrateRows(await NB.LoopCache.all()); } catch (e) {}
          if (more) { NB.bus.emit('library:changed'); NB.Pads.render(); }
          const stillMissing = allEntries.filter(([e]) => !NB.Library.has(idOf(e[2])));
          if (stillMissing.length) {
            totalPending = stillMissing.length; done = 0;
            await runQueue(stillMissing, 3);
            NB.bus.emit('library:changed');
            NB.Pads.render();
          }
          mark('phase2');
        }, 40);
      }

      mark('ready');
      set(100, 'ready');
      setTimeout(() => {
        $('#boot').classList.add('done');
        setTimeout(() => { $('#boot').style.display = 'none'; }, 320);
        NB.Timeline.resize();
        if (restored) toast('Restored your last session', '', 2200);
      }, 60);

      window.addEventListener('beforeunload', () => { NB.Persistence.save(); });

      /* expose for debugging / tests */
      window.NEONBOOM = NB;
    },
  };

  NB.App = App;
  window.addEventListener('DOMContentLoaded', () => {
    App.boot().catch((err) => {
      console.error(err);
      const msg = $('#bootMsg');
      if (msg) msg.textContent = 'Could not start: ' + err.message;
    });
  });
})(window.NB = window.NB || {});

</script>
</body>
</html>
