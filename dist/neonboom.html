        const sampleId = e.dataTransfer.getData('text/sample-id');
        if (!sampleId) return;
        const { x, y } = this._local(e);
        const idx = clamp(Math.floor(y / this.trackH()), 0, this.tracks.length - 1);
        const six = Math.round((x / this.pxPerSix()) / this.P.snap) * this.P.snap;
        NB.Pads.place(sampleId, this.tracks[idx].id, Math.max(0, six));
      });
    },

    _wireRuler() {
      const r = this.ruler;
      const localSix = (e) => {
        const rect = r.getBoundingClientRect();
        const x = e.clientX - rect.left + this.viewport.scrollLeft;
        const snap = this.P.snap;
        return Math.max(0, Math.round((x / this.pxPerSix()) / snap) * snap);
      };

      r.addEventListener('pointerdown', (e) => {
        r.setPointerCapture(e.pointerId);
        const P = this.P;
        const six = localSix(e);
        const rect = r.getBoundingClientRect();
        const xPx = e.clientX - rect.left;
        const inA = Math.abs((P.loopIn * this.pxPerSix() - this.viewport.scrollLeft) - xPx) < 12;
        const inB = Math.abs((P.loopOut * this.pxPerSix() - this.viewport.scrollLeft) - xPx) < 12;
        const inside = P.loopEnabled && xPx > P.loopIn * this.pxPerSix() - this.viewport.scrollLeft &&
          xPx < P.loopOut * this.pxPerSix() - this.viewport.scrollLeft;

        if (e.shiftKey || inA || inB || inside) {
          if (!P.loopEnabled) { P.loopEnabled = true; NB.bus.emit('loop'); }
          const anchor = inA ? 'in' : inB ? 'out' : inside ? 'move' : 'new';
          const start = { six, loopIn: P.loopIn, loopOut: P.loopOut };
          const move = (ev) => {
            const s2 = localSix(ev);
            if (anchor === 'in') P.loopIn = Math.min(s2, P.loopOut - P.snap);
            else if (anchor === 'out') P.loopOut = Math.max(s2, P.loopIn + P.snap);
            else if (anchor === 'move') {
              const delta = s2 - start.six;
              const len = start.loopOut - start.loopIn;
              let ni = Math.max(0, start.loopIn + delta);
              P.loopIn = ni; P.loopOut = ni + len;
            } else {
              P.loopIn = Math.min(start.six, s2);
              P.loopOut = Math.max(start.six, s2);
              if (P.loopOut - P.loopIn < P.snap) P.loopOut = P.loopIn + this.P.snap;
            }
            this.draw(); NB.bus.emit('loop');
          };
          const up = () => {
            r.removeEventListener('pointermove', move);
            if (P.loopOut - P.loopIn < this.P.snap) P.loopOut = P.loopIn + SIX_PER_BAR;
            NB.bus.emit('loop');
            NB.Persistence.saveSoon();
            if (NB.Transport.playing) { NB.Transport.pause(); NB.Transport.play(); }
          };
          r.addEventListener('pointermove', move);
          r.addEventListener('pointerup', up, { once: true });
        } else {
          NB.Transport.seekTo(six);
        }
      });
    },

    /* ---------------------------------------------------------- operations */
    setZoom(z, focusSix) {
      const prev = this.zoom;
      this.zoom = clamp(z, 0.18, 5);
      if (this.zoom === prev) return;
      this.spacer.style.width = this.contentW() + 'px';
      if (focusSix != null) {
        const target = focusSix * this.pxPerSix() - this.vw / 2;
        this.viewport.scrollLeft = Math.max(0, target);
      }
      this._rulerDirty = true;
      this.draw(); this.drawOverlay();
      NB.bus.emit('zoom', this.zoom);
    },
    zoomIn() { this.setZoom(this.zoom * 1.25, NB.Transport.currentSix()); },
    zoomOut() { this.setZoom(this.zoom / 1.25, NB.Transport.currentSix()); },
    zoomFit() {
      let endSix = SIX_PER_BAR * 8;
      this.tracks.forEach((t) => t.clips.forEach((c) => {
        endSix = Math.max(endSix, c.startSix + (c.trimEndSix - c.trimStartSix));
      }));
      this.setZoom((this.vw - 24) / (endSix * PX_PER_SIX));
      this.viewport.scrollLeft = 0;
      this.draw(); this.drawOverlay();
    },

    setMode(m) {
      this.mode = m;
      this.viewport.classList.toggle('edit', m === 'edit');
      NB.bus.emit('mode', m);
    },

    select(clipId) {
      this.selectedClipId = clipId;
      const f = clipId ? NB.project.findClip(clipId) : null;
      if (f) this.selectedTrackId = f.track.id;
      this.draw(); this.updateStatus();
    },

    splitAtPlayhead() {
      const id = this.selectedClipId;
      if (!id) { toast('Select a clip first', 'warn'); return; }
      const found = NB.project.findClip(id);
      if (!found) return;
      const { clip, track } = found;
      const six = Math.round(NB.Transport.currentSix());
      const start = clip.startSix, end = start + (clip.trimEndSix - clip.trimStartSix);
      if (six <= start + 0 || six >= end) { toast('Playhead is not over the clip', 'warn'); return; }
      NB.History.push();
      const cut = six - start;
      const second = JSON.parse(JSON.stringify(clip));
      second.id = uid('clp');
      second.trimStartSix = clip.trimStartSix + cut;
      second.startSix = six;
      clip.trimEndSix = clip.trimStartSix + cut;
      track.clips.push(second);
      this.selectedClipId = second.id;
      NB.bus.emit('clips:changed');
      NB.Transport.refresh();
      NB.Persistence.saveSoon();
    },

    deleteSelected() {
      if (!this.selectedClipId) { toast('Nothing selected', 'warn'); return; }
      NB.History.push();
      NB.project.removeClip(this.selectedClipId);
      this.selectedClipId = null;
      NB.bus.emit('clips:changed');
      NB.Transport.refresh();
      NB.Persistence.saveSoon();
      haptic(10);
    },

    duplicateSelected() {
      const id = this.selectedClipId;
      if (!id) { toast('Nothing selected', 'warn'); return; }
      const f = NB.project.findClip(id);
      if (!f) return;
      NB.History.push();
      const dup = JSON.parse(JSON.stringify(f.clip));
      dup.id = uid('clp');
      dup.startSix = f.clip.startSix + (f.clip.trimEndSix - f.clip.trimStartSix);
      f.track.clips.push(dup);
      this.selectedClipId = dup.id;
      NB.bus.emit('clips:changed');
      NB.Persistence.saveSoon();
    },

    nudge(sixDelta) {
      const id = this.selectedClipId;
      if (!id) return;
      const f = NB.project.findClip(id);
      if (!f) return;
      NB.History.push();
      f.clip.startSix = Math.max(0, f.clip.startSix + sixDelta);
      NB.bus.emit('clips:changed');
      NB.Transport.refresh();
      NB.Persistence.saveSoon();
    },

    quantize() {
      const id = this.selectedClipId;
      if (!id) { toast('Nothing selected', 'warn'); return; }
      const f = NB.project.findClip(id);
      if (!f) return;
      NB.History.push();
      const s = this.P.snap;
      f.clip.startSix = Math.round(f.clip.startSix / s) * s;
      NB.bus.emit('clips:changed');
      NB.Transport.refresh();
      toast('Quantized to ' + (s === 1 ? '1/16' : s === 2 ? '1/8' : '1/4'), 'ok', 1200);
    },

    scrollToPlayhead() {
      const x = NB.Transport.currentSix() * this.pxPerSix();
      if (x < this.viewport.scrollLeft || x > this.viewport.scrollLeft + this.vw - 60) {
        this.viewport.scrollLeft = Math.max(0, x - this.vw * 0.35);
      }
    },
  };

  /* ---------- canvas helpers ---------- */
  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  /* dark ink on light track colours, light ink on dark ones */
  function contrastText(hex) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.62 ? 'rgba(8,10,12,.92)' : 'rgba(255,255,255,.94)';
  }

  function hexA(hex, a) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  NB.Timeline = Timeline;
  NB.drawHelpers = { roundRect, hexA };
})(window.NB = window.NB || {});

</script>
<script>
/* =========================================================================
   NEONBOOM · ui/pads.js
   The playable surface: a filterable pad grid with waveform tiles.
   Tap = audition. Tap while armed = drop the loop at the playhead.
   Drag a pad onto the timeline to place it exactly where you drop it.
   ========================================================================= */
(function (NB) {
  'use strict';
  const { $, $$, el, toast, haptic, Grid } = NB.util;

  const Pads = {
    filter: 'All',
    armed: false,
    _keyMap: {},

    init() {
      this.grid = $('#padGrid');
      this.chips = $('#padChips');
      this.count = $('#padCount');
      this.recBtn = $('#btnRecArm');

      this.renderChips();
      this.render();

      this.recBtn.addEventListener('click', () => {
        this.armed = !this.armed;
        this.recBtn.classList.toggle('on', this.armed);
        toast(this.armed ? 'Rec armed — pad taps drop clips at the playhead' : 'Rec off', '', 1600);
        haptic(10);
      });

      NB.bus.on('library:changed', () => { this.renderChips(); this.render(); });
    },

    renderChips() {
      const cats = ['All', ...NB.Library.categories()];
      this.chips.innerHTML = '';
      cats.forEach((c) => {
        const b = el('button', { class: 'chip' + (c === this.filter ? ' on' : ''), text: c });
        b.addEventListener('click', () => {
          this.filter = c;
          $$('.chip', this.chips).forEach((x) => x.classList.toggle('on', x.textContent === c));
          this.render();
        });
        this.chips.appendChild(b);
      });
    },

    visibleSamples() {
      const all = NB.Library.list();
      return this.filter === 'All' ? all : all.filter((s) => s.category === this.filter);
    },

    render() {
      const list = this.visibleSamples();
      this.grid.innerHTML = '';
      this._keyMap = {};
      this.count.textContent = `${list.length}`;

      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'Q', 'W', 'E', 'R', 'A', 'S'];

      list.forEach((s, i) => {
        const pad = el('button', {
          class: 'pad',
          draggable: 'true',
          'data-id': s.id,
          'aria-label': s.name,
        });
        pad.style.setProperty('--pad-color', s.color);
        pad.innerHTML = `
          <span class="pname">${escapeHtml(s.name)}</span>
          <canvas class="pwave" width="220" height="52"></canvas>
          <span class="pcat"><i></i>${escapeHtml(s.category)}</span>
          ${i < keys.length ? `<span class="pkey">${keys[i]}</span>` : ''}`;

        drawPadWave(pad.querySelector('canvas'), s, s.color);
        if (i < keys.length) this._keyMap[keys[i].toLowerCase()] = s.id;

        pad.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          pad.classList.add('hit');
          setTimeout(() => pad.classList.remove('hit'), 120);
          haptic(8);
          this.trigger(s.id);
        });
        pad.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/sample-id', s.id);
          e.dataTransfer.effectAllowed = 'copy';
        });
        this.grid.appendChild(pad);
      });
    },

    /* audition + optional placement */
    trigger(sampleId) {
      const s = NB.Library.get(sampleId);
      if (!s) return;
      NB.Engine.preview(s.buffer, NB.Project.bpm / s.refBpm);
      if (this.armed) {
        const trackId = NB.Timeline.selectedTrackId || NB.Project.tracks[0].id;
        const clip = NB.Transport.recordPad(sampleId, trackId);
        NB.Timeline.select(clip.id);
        NB.Persistence.saveSoon();
      }
    },

    place(sampleId, trackId, startSix) {
      NB.History.push();
      const track = NB.Project.tracks.find((t) => t.id === trackId) || NB.Project.tracks[0];
      const clip = NB.project.newClip(sampleId, track.id, Math.max(0, startSix));
      track.clips.push(clip);
      NB.Timeline.selectedClipId = clip.id;
      NB.Timeline.selectedTrackId = track.id;
      NB.bus.emit('clips:changed');
      NB.Timeline.updateStatus();
      NB.Persistence.saveSoon();
      toast(`Added "${(NB.Library.get(sampleId) || {}).name}" at bar ${Grid.toBBT(startSix).bar}`, 'ok', 1400);
    },

    keyPress(key) {
      const id = this._keyMap[key.toLowerCase()];
      if (!id) return false;
      const pad = this.grid.querySelector(`.pad[data-id="${id}"]`);
      if (pad) { pad.classList.add('hit'); setTimeout(() => pad.classList.remove('hit'), 120); }
      this.trigger(id);
      return true;
    },
  };

  function drawPadWave(canvas, sample, color) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const peaks = sample.peaks;
    const mid = h / 2;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(0, mid - 0.5, w, 1);
    const bars = Math.min(w / 2, 110);
    const stepW = w / bars;
    for (let i = 0; i < bars; i++) {
      const v = peaks[Math.floor((i / bars) * peaks.length)] || 0;
      const bh = Math.max(1, v * (h * 0.44));
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.55 + v * 0.45;
      ctx.fillRect(i * stepW, mid - bh, Math.max(1, stepW - 1), bh * 2);
    }
    ctx.globalAlpha = 1;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  NB.Pads = Pads;
})(window.NB = window.NB || {});

</script>
<script>
/* =========================================================================
   NEONBOOM · ui/mixer.js
   Per-track strips: fader, pan, mute, solo, live level meter.
   Rebuilt only on structural change — never while a fader is being dragged.
   ========================================================================= */
(function (NB) {
  'use strict';
  const { $, $$, el, toast, haptic } = NB.util;

  const Mixer = {
    mount(host) {
      this.host = host;
      this.render();
      if (!this._meterTimer) this._meterTimer = setInterval(() => this.tickMeters(), 50);
      NB.bus.on('project:replaced', () => this.render());
    },

    render() {
      if (!this.host) return;
      const P = NB.Project;
      this.host.innerHTML = '';
      const row = el('div', { class: 'mixRow' });

      P.tracks.forEach((t, i) => {
        const strip = el('div', { class: 'mstrip' + (t.id === NB.Timeline.selectedTrackId ? ' sel' : '') });
        strip.dataset.trackId = t.id;
        strip.innerHTML = `
          <div class="mtrk">${String(i + 1).padStart(2, '0')}</div>
          <div class="mname" style="color:${t.color}" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div>
          <div class="mstripMeter"><i></i></div>
          <input class="mfader" type="range" min="0" max="1" step="0.01" value="${t.vol}" aria-label="${escapeHtml(t.name)} volume">
          <div class="mval">${Math.round(t.vol * 100)}%</div>
          <input class="mpan" type="range" min="-1" max="1" step="0.02" value="${t.pan}" aria-label="${escapeHtml(t.name)} pan">
          <div class="mbtns">
            <button class="tbtn m ${t.mute ? 'on' : ''}" data-act="mute">M</button>
            <button class="tbtn s ${t.solo ? 'on' : ''}" data-act="solo">S</button>
          </div>`;
        row.appendChild(strip);
      });

      const add = el('button', { class: 'btn', text: '+ Track', style: 'align-self:flex-start;margin-left:4px;' });
      add.addEventListener('click', () => NB.Shell.addTrack());
      row.appendChild(add);
      this.host.appendChild(row);

      this.host.oninput = (e) => {
        const strip = e.target.closest('.mstrip');
        if (!strip) return;
        const t = P.tracks.find((x) => x.id === strip.dataset.trackId);
        if (!t) return;
        if (e.target.classList.contains('mfader')) {
          t.vol = parseFloat(e.target.value);
          strip.querySelector('.mval').textContent = Math.round(t.vol * 100) + '%';
          NB.Engine.applyMix(P.tracks);
        }
        if (e.target.classList.contains('mpan')) {
          t.pan = parseFloat(e.target.value);
          NB.Engine.setTrackPan(P.tracks.indexOf(t), t.pan);
        }
      };
      this.host.onchange = () => NB.Persistence.saveSoon();
      this.host.onclick = (e) => {
        const btn = e.target.closest('button[data-act]');
        const strip = e.target.closest('.mstrip');
        if (!strip) return;
        const t = P.tracks.find((x) => x.id === strip.dataset.trackId);
        if (!t) return;
        if (!btn) { NB.Timeline.selectedTrackId = t.id; this.render(); NB.Timeline.rebuildHeaders(); return; }
        if (btn.dataset.act === 'mute') t.mute = !t.mute;
        if (btn.dataset.act === 'solo') t.solo = !t.solo;
        NB.Engine.applyMix(P.tracks);
        this.render();
        NB.Timeline.rebuildHeaders();
        NB.Timeline.draw();
        NB.Persistence.saveSoon();
        haptic(6);
      };
    },

    tickMeters() {
      if (!this.host || !NB.Engine || !this.host.offsetParent) return;
      const bars = $$('.mstrip .mstripMeter i', this.host);
      for (let i = 0; i < bars.length; i++) {
        const lvl = NB.Engine.readTrackLevel(i);
        bars[i].style.width = Math.min(100, lvl * 150) + '%';
        bars[i].style.background = lvl > 0.72 ? 'var(--danger)' : lvl > 0.4 ? 'var(--warn)' : 'var(--ok)';
      }
    },
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  NB.Mixer = Mixer;
})(window.NB = window.NB || {});

</script>
<script>
/* =========================================================================
   NEONBOOM · ui/fx.js
   Master FX rack bound straight to the live graph, plus snapshot() so the
   offline export can reproduce exactly what you hear.
   ========================================================================= */
(function (NB) {
  'use strict';
  const { $, $$, el, Grid, clamp } = NB.util;

  const DEFAULTS = {
    eqLow: 0, eqMid: 0, eqHigh: 0,
    delaySync: 2, delayFeedback: 0.32, delayMix: 0,
    reverbSize: 2.2, reverbDecay: 3.2, reverbMix: 0,
    crushBits: 8, crushRate: 4, crushMix: 0,
    compThresh: -6, compRatio: 12, masterVol: 0.9,
  };

  const Fx = {
    values: { ...DEFAULTS },

    mount(host) {
      this.host = host;
      this.render();
    },

    render() {
      if (!this.host) return;
      const v = this.values;
      this.host.innerHTML = `
        <div class="fxGrid">
          <div class="fxModule">
            <h5>3-band EQ</h5>
            ${row('Low 120 Hz', 'eqLow', -24, 24, 0.5, v.eqLow, (x) => x.toFixed(1) + ' dB')}
            ${row('Mid 1 kHz', 'eqMid', -24, 24, 0.5, v.eqMid, (x) => x.toFixed(1) + ' dB')}
            ${row('High 6 kHz', 'eqHigh', -24, 24, 0.5, v.eqHigh, (x) => x.toFixed(1) + ' dB')}
          </div>
          <div class="fxModule">
            <h5>Tempo delay</h5>
            <div class="knobRow"><label>Sync</label>
              <select id="fxDelaySync" style="flex:1">
                <option value="4"${v.delaySync === 4 ? ' selected' : ''}>1/4</option>
                <option value="2"${v.delaySync === 2 ? ' selected' : ''}>1/8</option>
                <option value="3"${v.delaySync === 3 ? ' selected' : ''}>1/8 dotted</option>
                <option value="1"${v.delaySync === 1 ? ' selected' : ''}>1/16</option>
              </select></div>
            ${row('Feedback', 'delayFeedback', 0, 0.9, 0.01, v.delayFeedback, (x) => Math.round(x * 100) + '%')}
            ${row('Mix', 'delayMix', 0, 1, 0.01, v.delayMix, (x) => Math.round(x * 100) + '%')}
          </div>
          <div class="fxModule">
            <h5>Room reverb</h5>
            ${row('Size', 'reverbSize', 0.4, 4, 0.1, v.reverbSize, (x) => x.toFixed(1) + ' s')}
            ${row('Decay', 'reverbDecay', 0.5, 6, 0.1, v.reverbDecay, (x) => x.toFixed(1))}
            ${row('Mix', 'reverbMix', 0, 1, 0.01, v.reverbMix, (x) => Math.round(x * 100) + '%')}
          </div>
          <div class="fxModule">
            <h5>Bitcrusher <span class="toggleChip ${v.crushMix > 0 ? 'on' : ''}" id="fxCrushChip">${v.crushMix > 0 ? 'ON' : 'OFF'}</span></h5>
            ${row('Bit depth', 'crushBits', 2, 16, 1, v.crushBits, (x) => Math.round(x) + ' bit')}
            ${row('Rate div', 'crushRate', 1, 16, 1, v.crushRate, (x) => Math.round(x) + '×')}
            ${row('Mix', 'crushMix', 0, 1, 0.01, v.crushMix, (x) => Math.round(x * 100) + '%')}
          </div>
          <div class="fxModule">
            <h5>Master</h5>
            ${row('Threshold', 'compThresh', -40, 0, 1, v.compThresh, (x) => Math.round(x) + ' dB')}
            ${row('Ratio', 'compRatio', 1, 20, 0.5, v.compRatio, (x) => x.toFixed(0) + ':1')}
            ${row('Volume', 'masterVol', 0, 1.2, 0.01, v.masterVol, (x) => Math.round(x * 100) + '%')}
          </div>
        </div>`;
      this.wire();
    },

    wire() {
      const m = NB.Engine.master;
      const ctxNow = () => NB.Engine.ctx.currentTime;

      $$('input[data-fx]', this.host).forEach((input) => {
        const key = input.dataset.fx;
        const out = input.parentElement.querySelector('.val');
        const fmt = FORMATS[key] || ((x) => x);
        input.addEventListener('input', () => {
          const val = parseFloat(input.value);
          this.values[key] = val;
          NB.Project.fx = { ...this.values };
          NB.Persistence.saveSoon();
          if (out) out.textContent = fmt(val);
          this.apply(key, val, m, ctxNow());
        });
        /* double-click a knob to reset it */
        input.addEventListener('dblclick', () => {
          const d = DEFAULTS[key];
          input.value = d; this.values[key] = d;
          if (out) out.textContent = fmt(d);
          this.apply(key, d, m, ctxNow());
        });
      });

      const sync = $('#fxDelaySync', this.host);
      if (sync) {
        sync.addEventListener('change', () => {
          this.values.delaySync = parseFloat(sync.value);
          this.apply('delaySync', this.values.delaySync, m, ctxNow());
        });
      }
      const chip = $('#fxCrushChip', this.host);
      if (chip) {
        chip.addEventListener('click', () => {
          const on = this.values.crushMix > 0;
          const next = on ? 0 : 0.6;
          const slider = $('input[data-fx="crushMix"]', this.host);
          if (slider) { slider.value = next; }
          this.values.crushMix = next;
          this.apply('crushMix', next, m, ctxNow());
          chip.classList.toggle('on', !on);
          chip.textContent = on ? 'OFF' : 'ON';
          const out = slider && slider.parentElement.querySelector('.val');
          if (out) out.textContent = Math.round(next * 100) + '%';
        });
      }
      /* push current values into the graph (covers re-mount / undo) */
      Object.keys(this.values).forEach((k) => this.apply(k, this.values[k], m, ctxNow()));
    },

    apply(key, val, m, t) {
      if (!m) return;
      const ramp = (param, v) => param.setTargetAtTime(v, t, 0.01);
      switch (key) {
        case 'eqLow': ramp(m.eqLow.gain, val); break;
        case 'eqMid': ramp(m.eqMid.gain, val); break;
        case 'eqHigh': ramp(m.eqHigh.gain, val); break;
        case 'delaySync': ramp(m.delay.delayTime, Grid.sixToSec(val, NB.Project.bpm)); break;
        case 'delayFeedback': ramp(m.feedback.gain, val); break;
        case 'delayMix': ramp(m.delayWet.gain, val); break;
        case 'reverbSize': m.convolver.buffer = NB.ImpulseResponse.generate(NB.Engine.ctx, val, this.values.reverbDecay); break;
        case 'reverbDecay': m.convolver.buffer = NB.ImpulseResponse.generate(NB.Engine.ctx, this.values.reverbSize, val); break;
        case 'reverbMix': ramp(m.reverbWet.gain, val); break;
        case 'crushBits': m.crusher._bits = val; break;
        case 'crushRate': m.crusher._reduction = val; break;
        case 'crushMix': ramp(m.bitWet.gain, val); ramp(m.bitDry.gain, 1 - val); break;
        case 'compThresh': ramp(m.comp.threshold, val); break;
        case 'compRatio': ramp(m.comp.ratio, val); break;
        case 'masterVol': ramp(m.masterGain.gain, val); break;
      }
    },

    /* keep tempo-synced delay in time when BPM changes */
    retime() { this.apply('delaySync', this.values.delaySync, NB.Engine.master, NB.Engine.ctx.currentTime); },

    snapshot() { return { ...this.values }; },
    reset() {
      this.values = { ...DEFAULTS };
      this.render();
    },
  };

  const FORMATS = {
    eqLow: (x) => x.toFixed(1) + ' dB', eqMid: (x) => x.toFixed(1) + ' dB', eqHigh: (x) => x.toFixed(1) + ' dB',
    delayFeedback: (x) => Math.round(x * 100) + '%', delayMix: (x) => Math.round(x * 100) + '%',
    reverbSize: (x) => x.toFixed(1) + ' s', reverbDecay: (x) => x.toFixed(1),
    reverbMix: (x) => Math.round(x * 100) + '%',
    crushBits: (x) => Math.round(x) + ' bit', crushRate: (x) => Math.round(x) + '×',
    crushMix: (x) => Math.round(x * 100) + '%',
    compThresh: (x) => Math.round(x) + ' dB', compRatio: (x) => x.toFixed(0) + ':1',
    masterVol: (x) => Math.round(x * 100) + '%',
  };

  function row(label, key, min, max, step, value, fmt) {
    return `<div class="knobRow"><label>${label}</label>
      <input type="range" data-fx="${key}" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}">
      <span class="val">${fmt(value)}</span></div>`;
  }

  NB.Fx = Fx;
})(window.NB = window.NB || {});

</script>
<script>
/* =========================================================================
   NEONBOOM · ui/inspector.js
   Context panel: the selected clip, the selected track, or the project.
   Everything here is an action on the current selection — no menus to hunt.
   ========================================================================= */
(function (NB) {
  'use strict';
  const { $, el, Grid, SIX_PER_BAR, toast } = NB.util;

  const Inspector = {
    mount(host) {
      this.host = host;
      this.render();
      NB.bus.on('selection', () => this.render());
      NB.bus.on('clips:changed', () => this.render());
      NB.bus.on('project:replaced', () => this.render());
      NB.bus.on('loop', () => this.render());
    },

    render() {
      if (!this.host) return;
      const T = NB.Timeline;
      const sel = T.selectedClipId ? NB.project.findClip(T.selectedClipId) : null;
      this.host.innerHTML = '';

      if (!sel) {
        this.host.appendChild(this.projectCard());
        this.host.appendChild(this.trackCard());
        return;
      }

      const { clip, track } = sel;
      const sample = NB.Library.get(clip.sampleId);
      const len = clip.trimEndSix - clip.trimStartSix;

      const card = el('div', { class: 'insp-card' });
      card.innerHTML = `
        <h4>Clip <span style="color:var(--ink-3);font-weight:400;text-transform:none;letter-spacing:0">${track.name}</span></h4>
        <div class="insp-title">${escapeHtml(sample ? sample.name : 'missing sample')}</div>
        <div class="insp-sub">${sample ? sample.category : '—'} · ${(sample ? sample.refBpm : 90)} BPM source</div>
        <canvas class="insp-wave" width="520" height="112"></canvas>
        <div class="statRow"><span>Starts at</span><b>${Grid.fmtBBT(clip.startSix)}</b></div>
        <div class="statRow"><span>Length</span><b>${Grid.fmtBars(len)}</b></div>
        <div class="statRow"><span>Ends at</span><b>${Grid.fmtBBT(clip.startSix + len)}</b></div>
        <div class="statRow"><span>Trim in / out</span><b>${clip.trimStartSix} / ${clip.trimEndSix}</b></div>
      `;
      this.host.appendChild(card);
      drawClipWave(card.querySelector('canvas'), sample, clip, track.color);

      /* clip gain */
      const gainCard = el('div', { class: 'insp-card' });
      gainCard.innerHTML = `<h4>Clip gain</h4>
        <div class="knobRow"><label>Gain</label>
          <input type="range" min="0" max="1.5" step="0.01" value="${clip.gain == null ? 1 : clip.gain}">
          <span class="val">${Math.round((clip.gain == null ? 1 : clip.gain) * 100)}%</span></div>`;
      const gIn = gainCard.querySelector('input');
      const gOut = gainCard.querySelector('.val');
      gIn.addEventListener('input', () => {
        clip.gain = parseFloat(gIn.value);
        gOut.textContent = Math.round(clip.gain * 100) + '%';
      });
      gIn.addEventListener('change', () => { NB.Transport.refresh(); NB.Persistence.saveSoon(); });
      this.host.appendChild(gainCard);

      /* sound: pitch, reverse, fades */
      const sound = el('div', { class: 'insp-card' });
      const pitch = clip.pitch || 0;
      sound.innerHTML = `<h4>Sound</h4>
        <div class="knobRow"><label>Pitch</label>
          <input type="range" min="-12" max="12" step="1" value="${pitch}" data-k="pitch">
          <span class="val">${pitch > 0 ? '+' : ''}${pitch} st</span></div>
        <div class="knobRow"><label>Fade in</label>
          <input type="range" min="0" max="${Math.floor(len / 2)}" step="1" value="${clip.fadeIn || 0}" data-k="fadeIn">
          <span class="val">${clip.fadeIn || 0}/16</span></div>
        <div class="knobRow"><label>Fade out</label>
          <input type="range" min="0" max="${Math.floor(len / 2)}" step="1" value="${clip.fadeOut || 0}" data-k="fadeOut">
          <span class="val">${clip.fadeOut || 0}/16</span></div>
        <div class="grid2" style="margin-top:4px">
          <button class="btn ${clip.reverse ? 'on' : ''}" id="clipReverse">${clip.reverse ? '⏪ Reversed' : '⏩ Reverse'}</button>
          <button class="btn" id="clipReset">Reset</button>
        </div>
        <p style="font-size:10.5px;color:var(--ink-2);margin:8px 0 0">Pitch is sampler-style: it changes speed with the pitch, like a turntable.</p>`;
      const fmtPitch = (v) => (v > 0 ? '+' : '') + v + ' st';
      sound.querySelectorAll('input[data-k]').forEach((inp) => {
        const k = inp.dataset.k;
        const out = inp.parentElement.querySelector('.val');
        inp.addEventListener('input', () => {
          clip[k] = k === 'pitch' ? parseInt(inp.value, 10) : parseInt(inp.value, 10);
          out.textContent = k === 'pitch' ? fmtPitch(clip[k]) : `${clip[k]}/16`;
          NB.Timeline.draw();
        });
        inp.addEventListener('change', () => { NB.Transport.refresh(); NB.Persistence.saveSoon(); });
      });
      sound.querySelector('#clipReverse').addEventListener('click', (e) => {
        NB.History.push();
        clip.reverse = !clip.reverse;
        e.currentTarget.classList.toggle('on', clip.reverse);
        e.currentTarget.textContent = clip.reverse ? '⏪ Reversed' : '⏩ Reverse';
        NB.Timeline.draw(); NB.Transport.refresh(); NB.Persistence.saveSoon();
      });
      sound.querySelector('#clipReset').addEventListener('click', () => {
        NB.History.push();
        clip.pitch = 0; clip.reverse = false; clip.fadeIn = 0; clip.fadeOut = 0; clip.gain = 1;
        NB.Timeline.draw(); NB.Transport.refresh(); NB.Persistence.saveSoon();
        this.render();
      });
      this.host.appendChild(sound);

      /* actions */
      const act = el('div', { class: 'insp-card' });
      act.innerHTML = '<h4>Actions</h4><div class="grid2" id="clipActions"></div>';
      const g = act.querySelector('#clipActions');
      const mk = (label, fn, cls = '') => {
        const b = el('button', { class: 'btn ' + cls, text: label });
        b.addEventListener('click', fn);
        g.appendChild(b);
      };
      mk('Split', () => T.splitAtPlayhead());
      mk('Duplicate', () => T.duplicateSelected());
      mk('Quantize', () => T.quantize());
      mk('Delete', () => T.deleteSelected(), 'danger');
      this.host.appendChild(act);

      const nudge = el('div', { class: 'insp-card' });
      nudge.innerHTML = '<h4>Nudge</h4><div class="grid2" id="nudgeBtns"></div>';
      const nb = nudge.querySelector('#nudgeBtns');
      [['◀ bar', -SIX_PER_BAR], ['◀ 16th', -1], ['16th ▶', 1], ['bar ▶', SIX_PER_BAR]].forEach(([label, d]) => {
        const b = el('button', { class: 'btn', text: label });
        b.addEventListener('click', () => T.nudge(d));
        nb.appendChild(b);
      });
      this.host.appendChild(nudge);
    },

    projectCard() {
      const P = NB.Project;
      const clips = P.tracks.reduce((n, t) => n + t.clips.length, 0);
      const card = el('div', { class: 'insp-card' });
      card.innerHTML = `
        <h4>Project</h4>
        <div class="insp-title">${escapeHtml(P.name)}</div>
        <div class="statRow"><span>Tracks</span><b>${P.tracks.length}</b></div>
        <div class="statRow"><span>Clips</span><b>${clips}</b></div>
        <div class="statRow"><span>Tempo</span><b>${P.bpm} BPM</b></div>
        <div class="statRow"><span>Loop</span><b>${P.loopEnabled ? Grid.fmtBBT(P.loopIn) + ' → ' + Grid.fmtBBT(P.loopOut) : 'off'}</b></div>
        <div class="knobRow" style="margin-top:8px"><label>Swing</label>
          <input type="range" min="0" max="0.6" step="0.02" value="${P.swing || 0}" id="projSwing">
          <span class="val">${Math.round((P.swing || 0) * 100)}%</span></div>
        <div class="grid2" style="margin-top:10px" id="projBtns"></div>`;
      const swingIn = card.querySelector('#projSwing');
      const swingOut = swingIn && swingIn.nextElementSibling;
      if (swingIn) {
        swingIn.addEventListener('input', () => {
          P.swing = parseFloat(swingIn.value);
          swingOut.textContent = Math.round(P.swing * 100) + '%';
        });
        swingIn.addEventListener('change', () => { NB.Transport.refresh(); NB.Persistence.saveSoon(); });
      }

      const box = card.querySelector('#projBtns');
      const mk = (label, fn, cls = '') => {
        const b = el('button', { class: 'btn ' + cls, text: label });
        b.addEventListener('click', fn);
        box.appendChild(b);
      };
      mk('Load demo', () => NB.Shell.loadDemo());
      mk('Save file', () => NB.Shell.saveProjectFile());
      mk('Open file', () => NB.Shell.openProjectFile());
      mk('Export WAV', () => NB.Shell.exportWav());
      return card;
    },

    trackCard() {
      const P = NB.Project;
      const id = NB.Timeline.selectedTrackId;
      const t = P.tracks.find((x) => x.id === id) || P.tracks[0];
      if (!t) return el('div');
      const card = el('div', { class: 'insp-card' });
      card.innerHTML = `
        <h4>Track <span style="color:var(--ink-3);font-weight:400;text-transform:none;letter-spacing:0">${P.tracks.indexOf(t) + 1}</span></h4>
        <div class="knobRow"><label>Name</label>
          <input type="text" value="${escapeHtml(t.name)}" style="flex:1" maxlength="24"></div>
        <div class="knobRow"><label>Volume</label>
          <input type="range" min="0" max="1" step="0.01" value="${t.vol}"><span class="val">${Math.round(t.vol * 100)}%</span></div>
        <div class="knobRow"><label>Pan</label>
          <input type="range" min="-1" max="1" step="0.02" value="${t.pan}"><span class="val">${t.pan === 0 ? 'C' : (t.pan > 0 ? 'R' : 'L') + Math.round(Math.abs(t.pan) * 100)}</span></div>
        <div class="grid2" style="margin-top:6px" id="trkBtns"></div>`;
      const [nameIn] = card.querySelectorAll('input[type=text]');
      nameIn.addEventListener('change', () => {
        t.name = nameIn.value.slice(0, 24) || t.name;
        NB.Timeline.rebuildHeaders(); NB.Mixer.render(); NB.Persistence.saveSoon();
      });
      const [volIn, panIn] = card.querySelectorAll('input[type=range]');
      volIn.addEventListener('input', () => {
        t.vol = parseFloat(volIn.value);
        volIn.nextElementSibling.textContent = Math.round(t.vol * 100) + '%';
        NB.Engine.applyMix(P.tracks);
        NB.Timeline.rebuildHeaders();
      });
      panIn.addEventListener('input', () => {
        t.pan = parseFloat(panIn.value);
        panIn.nextElementSibling.textContent = t.pan === 0 ? 'C' : (t.pan > 0 ? 'R' : 'L') + Math.round(Math.abs(t.pan) * 100);
        NB.Engine.setTrackPan(P.tracks.indexOf(t), t.pan);
      });
      card.querySelectorAll('input').forEach((i) => i.addEventListener('change', () => NB.Persistence.saveSoon()));

      const box = card.querySelector('#trkBtns');
      const clear = el('button', { class: 'btn danger', text: 'Clear clips' });
      clear.addEventListener('click', () => {
        if (!t.clips.length) { toast('Track is already empty', 'warn'); return; }
        NB.History.push();
        t.clips = [];
        NB.bus.emit('clips:changed');
        NB.Transport.refresh();
        NB.Persistence.saveSoon();
      });
      const del = el('button', { class: 'btn danger', text: 'Delete track' });
      del.addEventListener('click', () => NB.Shell.removeTrack(t.id));
      box.appendChild(clear); box.appendChild(del);
      return card;
    },
  };

  function drawClipWave(canvas, sample, clip, color) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#07090b'; ctx.fillRect(0, 0, w, h);
    if (!sample) return;
    const peaks = sample.peaks;
    const total = sample.beats * 4;
    const i0 = Math.floor((clip.trimStartSix / total) * peaks.length);
    const i1 = Math.ceil((clip.trimEndSix / total) * peaks.length);
    const n = Math.max(1, i1 - i0);
    const mid = h / 2;
    for (let x = 0; x < w; x++) {
      const v = peaks[Math.min(peaks.length - 1, i0 + Math.floor((x / w) * n))] || 0;
      const bh = Math.max(1, v * (h * 0.44));
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.55 + v * 0.45;
      ctx.fillRect(x, mid - bh, 1, bh * 2);
    }
    ctx.globalAlpha = 1;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  NB.Inspector = Inspector;
})(window.NB = window.NB || {});

</script>
<script>
/* =========================================================================
   NEONBOOM · ui/shell.js
   Transport bar, drawer (mixer / fx / export / help), mobile views, sheets,
   keyboard shortcuts, file import, project files, export.
   ========================================================================= */
(function (NB) {
  'use strict';
  const { $, $$, el, clamp, Grid, toast, haptic, slug, fmtSec } = NB.util;

  const ICONS = {
    play: '<path d="M8 5v14l11-7z" fill="currentColor"/>',
    pause: '<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/>',
  };

  const Shell = {
    drawer: 'mixer',

    init() {
      this.lcd = $('#lcdPos');
      this.playBtn = $('#btnPlay');
      this.bpmInput = $('#bpm');
      this.saveState = $('#saveState');

      this.wireTransport();
      this.wireDrawer();
      this.wireTabs();
      this.wireZoom();
      this.wireImport();
      this.wireKeyboard();
      this.wireSheet();
      this.wireInstall();

      this.buildVu();
      this.wireLcd();

      NB.bus.on('transport', (s) => this.onTransport(s));
      NB.bus.on('playhead', () => this.updateLcd());
      NB.bus.on('saved', () => this.setSaved(true));
      NB.bus.on('saving', () => this.setSaved(false));
      NB.bus.on('loop', () => this.syncLoopBtn());
      NB.bus.on('history', (s) => {
        $('#btnUndo').disabled = !s.canUndo;
        $('#btnRedo').disabled = !s.canRedo;
      });

      this.openDrawer('mixer');
      this.updateLcd();
      this.syncLoopBtn();
      $('#btnUndo').disabled = true;
      $('#btnRedo').disabled = true;

      setInterval(() => this.updateVu(), 45);
      /* per-frame work stays minimal: LCD text only. Meters run on a timer. */
      NB.Transport.onTick(() => this.updateLcd());
    },

    /* ------------------------------------------------------------ top bar */
    wireTransport() {
      $('#btnPlay').addEventListener('click', () => NB.Transport.toggle());
      $('#btnStop').addEventListener('click', () => NB.Transport.stop());
      $('#btnRewind').addEventListener('click', () => NB.Transport.rewind());
      $('#btnLoop').addEventListener('click', () => {
        const P = NB.Project;
        P.loopEnabled = !P.loopEnabled;
        if (P.loopEnabled && P.loopOut <= P.loopIn) { P.loopIn = 0; P.loopOut = 16 * 4; }
        NB.Timeline.draw();
        this.syncLoopBtn();
        if (NB.Transport.playing) { NB.Transport.pause(); NB.Transport.play(); }
        NB.Persistence.saveSoon();
        haptic(8);
      });
      $('#btnMetro').addEventListener('click', (e) => {
        NB.Project.metronome = !NB.Project.metronome;
        e.currentTarget.classList.toggle('on', NB.Project.metronome);
        toast(NB.Project.metronome ? 'Metronome on' : 'Metronome off', '', 1200);
      });
      $('#btnUndo').addEventListener('click', () => { if (!NB.History.undo()) toast('Nothing to undo', 'warn', 1200); });
      $('#btnRedo').addEventListener('click', () => { if (!NB.History.redo()) toast('Nothing to redo', 'warn', 1200); });
      $('#btnExport').addEventListener('click', () => this.exportWav());
      $('#btnHelp').addEventListener('click', () => this.openDrawer('help'));
      $('#btnAddTrack').addEventListener('click', () => this.addTrack());

      $$('[data-tempo]').forEach((b) => b.addEventListener('click', () => {
        const P = NB.Project;
        P.bpm = clamp(P.bpm + parseInt(b.dataset.tempo, 10), 40, 220);
        this.bpmInput.value = P.bpm;
        NB.Fx.retime();
        if (NB.Transport.playing) { NB.Transport.pause(); NB.Transport.play(); }
        NB.Persistence.saveSoon();
      }));

      this.bpmInput.addEventListener('change', () => {
        const P = NB.Project;
        P.bpm = clamp(parseInt(this.bpmInput.value || '90', 10), 40, 220);
        this.bpmInput.value = P.bpm;
        NB.Fx.retime();
        if (NB.Transport.playing) { NB.Transport.pause(); NB.Transport.play(); }
        NB.Persistence.saveSoon();
      });

      /* keep the playhead visible while rolling */
      let lastScroll = 0;
      NB.bus.on('playhead', () => {
        if (!NB.Transport.playing) return;
        const now = performance.now();
        if (now - lastScroll < 400) return;
        lastScroll = now;
        NB.Timeline.scrollToPlayhead();
      });
    },

    onTransport(s) {
      const playing = !!s.playing;
      this.playBtn.classList.toggle('on', playing);
      const svg = this.playBtn.querySelector('svg');
      if (svg) svg.innerHTML = playing ? ICONS.pause : ICONS.play;
      this.playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    },

    syncLoopBtn() { $('#btnLoop').classList.toggle('on', NB.Project.loopEnabled); },

    updateLcd() {
      const txt = Grid.fmtBBT(NB.Transport.currentSix());
      if (this._lcdText !== txt) { this._lcdText = txt; this.lcd.textContent = txt; }
    },

    wireLcd() {
      const lcd = $('#lcd');
      lcd.addEventListener('click', () => {
        if (window.matchMedia('(max-width:860px)').matches) this.openTransportSheet();
        else { this.bpmInput.focus(); this.bpmInput.select(); }
      });
      this.syncLcdSub();
      setInterval(() => this.syncLcdSub(), 800);
    },

    /* phones drop the separate tempo widget: BPM lives in the LCD line */
    syncLcdSub() {
      const sub = $('#lcdSub');
      if (!sub) return;
      const small = window.matchMedia('(max-width:680px)').matches;
      const txt = small
        ? `${NB.Project.bpm} BPM · ${NB.Project.snap === 1 ? '1/16' : NB.Project.snap === 2 ? '1/8' : '1/4'}`
        : 'BAR · BEAT · 16TH';
      if (sub.textContent !== txt) sub.textContent = txt;
    },

    openTransportSheet() {
      const P = NB.Project;
      this.sheet(`
        <h4>Transport</h4>
        <div class="sheetRow"><label>Tempo</label>
          <button class="btn" id="tsDown" style="min-width:44px">−</button>
          <input type="number" id="tsBpm" value="${P.bpm}" min="40" max="220" style="width:74px;text-align:center">
          <button class="btn" id="tsUp" style="min-width:44px">+</button>
          <span style="font-size:11px;color:var(--ink-2)">BPM</span></div>
        <div class="sheetRow"><label>Snap</label>
          <select id="tsSnap" style="flex:1">
            <option value="4"${P.snap === 4 ? ' selected' : ''}>1/4 bar</option>
            <option value="2"${P.snap === 2 ? ' selected' : ''}>1/8 bar</option>
            <option value="1"${P.snap === 1 ? ' selected' : ''}>1/16 bar</option>
          </select></div>
        <div class="sheetRow"><label>Metronome</label>
          <input type="checkbox" id="tsMetro" ${P.metronome ? 'checked' : ''} style="width:24px;height:24px"></div>
        <div class="sheetRow"><label>Loop</label>
          <span style="font-family:var(--mono);font-size:11px;flex:1">${P.loopEnabled ? Grid.fmtBBT(P.loopIn) + ' → ' + Grid.fmtBBT(P.loopOut) : 'off'}</span>
          <button class="btn" id="tsLoop">${P.loopEnabled ? 'Off' : 'On'}</button></div>
        <div class="sheetBtns">
          <button class="btn" id="tsRewind">Rewind</button>
          <button class="btn primary" id="tsPlay">Play / Pause</button>
        </div>`);
      const s = $('#sheet');
      const setBpm = (v) => {
        P.bpm = clamp(v, 40, 220);
        $('#tsBpm', s).value = P.bpm;
        this.bpmInput.value = P.bpm;
        NB.Fx.retime();
        this.syncLcdSub();
        if (NB.Transport.playing) { NB.Transport.pause(); NB.Transport.play(); }
        NB.Persistence.saveSoon();
      };
      $('#tsDown', s).addEventListener('click', () => setBpm(P.bpm - 1));
      $('#tsUp', s).addEventListener('click', () => setBpm(P.bpm + 1));
      $('#tsBpm', s).addEventListener('change', (e) => setBpm(parseInt(e.target.value, 10) || P.bpm));
      $('#tsSnap', s).addEventListener('change', (e) => { P.snap = parseInt(e.target.value, 10); this.syncLcdSub(); NB.Persistence.saveSoon(); });
      $('#tsMetro', s).addEventListener('change', (e) => { P.metronome = e.target.checked; $('#btnMetro').classList.toggle('on', P.metronome); });
      $('#tsLoop', s).addEventListener('click', () => { this.closeSheet(); $('#btnLoop').click(); });
      $('#tsRewind', s).addEventListener('click', () => { this.closeSheet(); NB.Transport.rewind(); });
      $('#tsPlay', s).addEventListener('click', () => { this.closeSheet(); NB.Transport.toggle(); });
    },

    buildVu() {
      const host = $('#masterVu');
      host.innerHTML = '';
      for (let i = 0; i < 10; i++) host.appendChild(el('i'));
      this.vuBars = $$('i', host);
    },

    updateVu() {
      if (!this.vuBars || !NB.Engine) return;
      const levels = NB.Engine.readMasterVU(10);
      for (let i = 0; i < this.vuBars.length; i++) {
        const v = levels[i] || 0;
        const bar = this.vuBars[i];
        const cls = v > 0.78 ? 'hot' : v > 0.12 ? 'on' : '';
        if (bar.className !== cls) bar.className = cls;
      }
    },

    setSaved(ok) {
      if (!this.saveState) return;
      this.saveState.textContent = ok ? 'saved' : 'saving…';
      this.saveState.style.color = ok ? 'var(--ink-2)' : 'var(--amber)';
    },

    /* ------------------------------------------------------------- drawer */
    wireDrawer() {
      $$('#drawerTabs button').forEach((b) => {
        b.addEventListener('click', () => this.openDrawer(b.dataset.drawer));
      });
    },

    openDrawer(name) {
      this.drawer = name;
      const drawer = $('#drawer');
      drawer.dataset.open = 'true';
      $$('#drawerTabs button').forEach((b) => b.classList.toggle('on', b.dataset.drawer === name));
      const host = $('#drawerBody');
      if (name === 'mixer') { host.innerHTML = ''; NB.Mixer.mount(host); }
      if (name === 'fx') { host.innerHTML = ''; NB.Fx.mount(host); }
      if (name === 'export') this.renderExport(host);
      if (name === 'help') this.renderHelp(host);
      if (window.matchMedia('(max-width:900px)').matches) drawer.classList.add('mobileOpen');
    },

    renderExport(host) {
      host.innerHTML = `
        <div class="pane">
          <h3>Export</h3>
          <p>Renders the arrangement through the same master chain you are hearing and writes a 16-bit PCM WAV. Everything happens on this device — nothing is uploaded.</p>
          <div class="row">
            <button class="btn primary" id="exWav">Download WAV</button>
            <button class="btn" id="exLoop">Download loop region</button>
            <button class="btn" id="exStems">Download stems (.zip)</button>
            <button class="btn" id="exJson">Save project file</button>
            <button class="btn" id="exOpen">Open project file</button>
          </div>
          <div class="row">
            <button class="btn danger" id="exClear">Clear autosave &amp; start over</button>
          </div>
          <p style="font-size:11px;color:var(--ink-2)">Tip: bounce a short loop region for a sample pack, or the whole arrangement for a track. Stems render each track on its own, through the same master chain, and arrive as one zip. Long renders (&gt;8 min) take a few seconds and a chunk of memory.</p>
        </div>`;
      $('#exWav', host).addEventListener('click', () => this.exportWav(false));
      $('#exLoop', host).addEventListener('click', () => this.exportWav(true));
      $('#exStems', host).addEventListener('click', () => this.exportStems());
      $('#exJson', host).addEventListener('click', () => this.saveProjectFile());
      $('#exOpen', host).addEventListener('click', () => this.openProjectFile());
      $('#exClear', host).addEventListener('click', async () => {
        if (!confirm('Clear the autosaved project and start fresh? This cannot be undone.')) return;
        await NB.Persistence.clear();
        location.reload();
      });
    },

    renderHelp(host) {
      host.innerHTML = `
        <div class="pane">
          <h3>NEONBOOM 1.1</h3>
          <p>A beat workstation that lives in a tab. All 27 loops are synthesised on this device at boot — there are no audio downloads, no account, and no server. Your project autosaves to this browser.</p>
          <h3 style="font-size:12px;margin-top:14px">Keyboard</h3>
          <div class="shortcuts">
            <div><span>Play / pause</span><span class="kbd">Space</span></div>
            <div><span>Rewind</span><span class="kbd">R</span></div>
            <div><span>Loop on / off</span><span class="kbd">L</span></div>
            <div><span>Metronome</span><span class="kbd">K</span></div>
            <div><span>Split at playhead</span><span class="kbd">S</span></div>
            <div><span>Delete clip</span><span class="kbd">Del</span></div>
            <div><span>Duplicate clip</span><span class="kbd">Ctrl D</span></div>
            <div><span>Nudge clip</span><span class="kbd">← →</span></div>
            <div><span>Quantize</span><span class="kbd">Q</span></div>
            <div><span>Undo / redo</span><span class="kbd">Ctrl Z / Y</span></div>
            <div><span>Zoom</span><span class="kbd">- +</span></div>
            <div><span>Fit project</span><span class="kbd">F</span></div>
            <div><span>Mute track</span><span class="kbd">M</span></div>
            <div><span>Audition pads</span><span class="kbd">1-0 Q W</span></div>
          </div>
          <h3 style="font-size:12px;margin-top:16px">Credits &amp; licence</h3>
          <p style="font-size:11.5px">Built by <b>Dr Sohil Momin</b> · <a href="https://github.com/drsamonline/neonboom" target="_blank" rel="noopener">github.com/drsamonline/neonboom</a>.
          Licensed under the <b>PolyForm Noncommercial License 1.0.0</b> — free for personal, study, teaching, research and non-profit use; commercial use needs a separate licence.</p>
          <p style="font-size:11.5px">No third-party code, fonts or samples are bundled: all 27 loops are synthesised here at boot, and the reverb impulse is generated noise. The techniques follow public Web Audio documentation and the reading list in CREDITS.md — <i>The Audio Programming Book</i> (Boulanger &amp; Lazzarini, MIT Press), <i>Web Audio API</i> (Boris Smus, O'Reilly), <i>Designing Sound</i> (Andy Farnell, MIT Press), <i>Musimathics</i> (Gareth Loy, MIT Press).</p>
          <p style="font-size:11.5px">If this is useful to you: <a href="https://github.com/sponsors/drsamonline" target="_blank" rel="noopener">sponsor the work</a> or <a href="https://github.com/drsamonline/neonboom/issues" target="_blank" rel="noopener">report a bug</a>.</p>
          <div class="row" style="margin-top:10px">
            <button class="btn" id="helpDemo">Load the demo beat</button>
            <button class="btn" id="helpSave">Save project file</button>
          </div>
        </div>`;
      $('#helpDemo', host).addEventListener('click', () => this.loadDemo());
      $('#helpSave', host).addEventListener('click', () => this.saveProjectFile());
    },

    /* -------------------------------------------------------- mobile tabs */
    wireTabs() {
      $$('#tabbar button').forEach((b) => b.addEventListener('click', () => this.setView(b.dataset.view)));
    },

    setView(view) {
      $$('#tabbar button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
      const drawer = $('#drawer');
      if (view === 'mixer' || view === 'fx') {
        document.body.dataset.view = 'arrange';
        this.openDrawer(view);
        drawer.classList.add('mobileOpen');
        return;
      }
      drawer.classList.remove('mobileOpen');
      if (view === 'more') { this.openMoreSheet(); return; }
      document.body.dataset.view = view;
      if (view === 'arrange') requestAnimationFrame(() => NB.Timeline.resize());
    },

    openMoreSheet() {
      const P = NB.Project;
      this.sheet(`
        <h4>Project</h4>
        <div class="sheetRow"><label>Name</label><input type="text" id="shName" value="${escapeAttr(P.name)}" style="flex:1"></div>
        <div class="sheetRow"><label>Snap</label>
          <select id="shSnap" style="flex:1">
            <option value="4"${P.snap === 4 ? ' selected' : ''}>1/4 bar</option>
            <option value="2"${P.snap === 2 ? ' selected' : ''}>1/8 bar</option>
            <option value="1"${P.snap === 1 ? ' selected' : ''}>1/16 bar</option>
          </select></div>
        <div class="sheetRow"><label>Swing</label>
          <input type="range" id="shSwing" min="0" max="0.6" step="0.02" value="${P.swing || 0}">
          <span class="val" id="shSwingVal">${Math.round((P.swing || 0) * 100)}%</span></div>
        <div class="sheetRow"><label>Metronome</label><input type="checkbox" id="shMetro" ${P.metronome ? 'checked' : ''} style="width:22px;height:22px"></div>
        <div class="sheetBtns">
          <button class="btn" id="shDemo">Load demo</button>
          <button class="btn" id="shSave">Save project</button>
          <button class="btn" id="shOpen">Open project</button>
          <button class="btn primary" id="shWav">Export WAV</button>
          <button class="btn" id="shHelp">Shortcuts</button>
          <button class="btn danger" id="shClear">Start over</button>
        </div>`);
      const s = $('#sheet');
      $('#shName', s).addEventListener('change', (e) => { P.name = e.target.value || P.name; NB.Persistence.saveSoon(); });
      $('#shSnap', s).addEventListener('change', (e) => { P.snap = parseInt(e.target.value, 10); NB.Persistence.saveSoon(); });
      $('#shSwing', s).addEventListener('input', (e) => {
        P.swing = parseFloat(e.target.value);
        $('#shSwingVal', s).textContent = Math.round(P.swing * 100) + '%';
      });
      $('#shSwing', s).addEventListener('change', () => { NB.Transport.refresh(); NB.Persistence.saveSoon(); });
      $('#shMetro', s).addEventListener('change', (e) => { P.metronome = e.target.checked; $('#btnMetro').classList.toggle('on', P.metronome); });
      $('#shDemo', s).addEventListener('click', () => { this.closeSheet(); this.loadDemo(); });
      $('#shSave', s).addEventListener('click', () => { this.closeSheet(); this.saveProjectFile(); });
      $('#shOpen', s).addEventListener('click', () => { this.closeSheet(); this.openProjectFile(); });
      $('#shWav', s).addEventListener('click', () => { this.closeSheet(); this.exportWav(); });
      $('#shHelp', s).addEventListener('click', () => { this.closeSheet(); this.openDrawer('help'); });
      $('#shClear', s).addEventListener('click', async () => {
        if (!confirm('Clear the autosaved project and start fresh?')) return;
        await NB.Persistence.clear(); location.reload();
      });
    },

    /* ------------------------------------------------------------- sheets */
    wireSheet() {
      /* pointerdown, not click: a long-press opens the sheet while the finger
         is still down, and the compatibility click that arrives on release
         would close it again immediately. A pointerdown can only come from a
         *new* gesture, so dismissal stays predictable on every device. */
      $('#scrim').addEventListener('pointerdown', () => {
        if (performance.now() - (this._sheetOpenedAt || 0) < 150) return;
        this.closeSheet();
      });
    },

    sheet(html) {
      this._sheetOpenedAt = performance.now();
      const s = $('#sheet');
      s.innerHTML = `<div class="grab"></div>${html}`;
      s.classList.add('on');
      $('#scrim').classList.add('on');
    },

    closeSheet() {
      $('#sheet').classList.remove('on');
      $('#scrim').classList.remove('on');
    },

    openClipSheet(clipId) {
      const f = NB.project.findClip(clipId);
      if (!f) return;
      const { clip } = f;
      const sample = NB.Library.get(clip.sampleId);
      const gain = clip.gain == null ? 1 : clip.gain;
      this.sheet(`
        <h4>${escapeHtml(sample ? sample.name : 'Clip')}</h4>
        <div class="sheetRow"><label>Gain</label>
          <input type="range" id="csGain" min="0" max="1.5" step="0.01" value="${gain}">
          <span class="val" id="csGainVal">${Math.round(gain * 100)}%</span></div>
        <div class="sheetRow"><label>Pitch</label>
          <input type="range" id="csPitch" min="-12" max="12" step="1" value="${clip.pitch || 0}">
          <span class="val" id="csPitchVal">${clip.pitch > 0 ? '+' : ''}${clip.pitch || 0} st</span></div>
        <div class="sheetRow"><label>Fade in</label>
          <input type="range" id="csFadeIn" min="0" max="${Math.floor((clip.trimEndSix - clip.trimStartSix) / 2)}" step="1" value="${clip.fadeIn || 0}">
          <span class="val" id="csFadeInVal">${clip.fadeIn || 0}</span></div>
        <div class="sheetRow"><label>Fade out</label>
          <input type="range" id="csFadeOut" min="0" max="${Math.floor((clip.trimEndSix - clip.trimStartSix) / 2)}" step="1" value="${clip.fadeOut || 0}">
          <span class="val" id="csFadeOutVal">${clip.fadeOut || 0}</span></div>
        <div class="sheetRow"><label>Starts</label><span style="font-family:var(--mono);font-size:11px">${Grid.fmtBBT(clip.startSix)}</span></div>
        <div class="sheetRow"><label>Length</label><span style="font-family:var(--mono);font-size:11px">${Grid.fmtBars(clip.trimEndSix - clip.trimStartSix)}</span></div>
        <div class="sheetBtns">
          <button class="btn" id="csRev">${clip.reverse ? '⏪ Reversed' : '⏩ Reverse'}</button>
          <button class="btn" id="csDup">Duplicate</button>
          <button class="btn" id="csSplit">Split here</button>
          <button class="btn" id="csQuant">Quantize</button>
          <button class="btn danger" id="csDel">Delete</button>
        </div>`);
      const s = $('#sheet');
      $('#csGain', s).addEventListener('input', (e) => {
        clip.gain = parseFloat(e.target.value);
        $('#csGainVal', s).textContent = Math.round(clip.gain * 100) + '%';
      });
      $('#csGain', s).addEventListener('change', () => { NB.Transport.refresh(); NB.Persistence.saveSoon(); });
      $('#csPitch', s).addEventListener('input', (e) => {
        clip.pitch = parseInt(e.target.value, 10);
        $('#csPitchVal', s).textContent = (clip.pitch > 0 ? '+' : '') + clip.pitch + ' st';
        NB.Timeline.draw();
      });
      $('#csPitch', s).addEventListener('change', () => { NB.Transport.refresh(); NB.Persistence.saveSoon(); });
      ['csFadeIn', 'csFadeOut'].forEach((id) => {
        const key = id === 'csFadeIn' ? 'fadeIn' : 'fadeOut';
        $('#' + id, s).addEventListener('input', (e) => {
          clip[key] = parseInt(e.target.value, 10);
          $('#' + id + 'Val', s).textContent = clip[key];
          NB.Timeline.draw();
        });
        $('#' + id, s).addEventListener('change', () => { NB.Transport.refresh(); NB.Persistence.saveSoon(); });
      });
      $('#csRev', s).addEventListener('click', (e) => {
        NB.History.push();
        clip.reverse = !clip.reverse;
        e.currentTarget.textContent = clip.reverse ? '⏪ Reversed' : '⏩ Reverse';
        NB.Timeline.draw(); NB.Transport.refresh(); NB.Persistence.saveSoon();
      });
      $('#csDup', s).addEventListener('click', () => { this.closeSheet(); NB.Timeline.duplicateSelected(); });
      $('#csSplit', s).addEventListener('click', () => { this.closeSheet(); NB.Timeline.splitAtPlayhead(); });
      $('#csQuant', s).addEventListener('click', () => { this.closeSheet(); NB.Timeline.quantize(); });
      $('#csDel', s).addEventListener('click', () => { this.closeSheet(); NB.Timeline.deleteSelected(); });
    },

    /* --------------------------------------------------------- zoom + mode */
    wireZoom() {
      $$('[data-zoom]').forEach((b) => b.addEventListener('click', () => {
        const a = b.dataset.zoom;
        if (a === 'in') NB.Timeline.zoomIn();
        else if (a === 'out') NB.Timeline.zoomOut();
        else NB.Timeline.zoomFit();
      }));
      $$('#modeGrp button').forEach((b) => b.addEventListener('click', () => {
        $$('#modeGrp button').forEach((x) => x.classList.toggle('on', x === b));
        NB.Timeline.setMode(b.dataset.mode);
      }));
      NB.bus.on('zoom', (z) => { $('#zoomLbl').textContent = Math.round(z * 100) + '%'; });
    },

    /* ------------------------------------------------------------- import */
    wireImport() {
      const input = $('#fileInput');
      $('#btnImport').addEventListener('click', () => input.click());
      input.addEventListener('change', () => {
        if (input.files.length) this.importFiles(input.files);
        input.value = '';
      });

      /* drag audio anywhere onto the app */
      ['dragover', 'drop'].forEach((evt) => document.addEventListener(evt, (e) => {
        if (!e.dataTransfer) return;
        if (evt === 'dragover') { e.preventDefault(); return; }
        if (e.dataTransfer.files && e.dataTransfer.files.length) {
          e.preventDefault();
          this.importFiles(e.dataTransfer.files);
        }
      }));
    },

    async importFiles(files) {
      const list = Array.from(files).filter((f) => /audio|\.(wav|mp3|ogg|flac|m4a|aac|webm)$/i.test(f.type + f.name));
      if (!list.length) { toast('No audio files found', 'warn'); return; }
      let ok = 0;
      for (const file of list) {
        try {
          const bytes = await file.arrayBuffer();
          const buffer = await NB.Engine.ctx.decodeAudioData(bytes.slice(0));
          NB.Library.register({
            name: file.name.replace(/\.[^.]+$/, ''),
            buffer,
            category: 'Imported',
            color: NB.util.TRACK_COLORS[NB.Library.items.size % NB.util.TRACK_COLORS.length],
            refBpm: NB.Project.bpm,           // assume it already fits the project
            isUser: true,
            rawBytes: bytes,
          });
          ok++;
        } catch (err) {
          console.error('import failed', file.name, err);
          toast(`Could not decode "${file.name}"`, 'err', 3200);
        }
      }
      if (ok) {
        NB.bus.emit('library:changed');
        NB.Persistence.saveSoon();
        toast(`Imported ${ok} file${ok > 1 ? 's' : ''} — tag tempo in the clip panel if it drifts`, 'ok', 3200);
      }
    },

    /* ------------------------------------------------------------ projects */
    loadDemo() {
      NB.History.push();
      NB.project.buildDemo();
      NB.Engine.ensureTrackBuses(NB.Project.tracks.length);
      NB.Engine.applyMix(NB.Project.tracks);
      $('#bpm').value = NB.Project.bpm;
      NB.bus.emit('project:replaced');
      NB.Timeline.zoomFit();
      NB.Persistence.saveSoon();
      this.syncLoopBtn();
      toast('Demo beat loaded — press space', 'ok', 2600);
    },

    addTrack() {
      if (NB.Project.tracks.length >= 24) { toast('24 tracks is the practical limit', 'warn'); return; }
      NB.History.push();
      const t = NB.project.addTrack();
      NB.Engine.ensureTrackBuses(NB.Project.tracks.length);
      NB.Engine.applyMix(NB.Project.tracks);
      NB.Timeline.selectedTrackId = t.id;
      NB.bus.emit('project:replaced');
      NB.Mixer.render();
      NB.Persistence.saveSoon();
      toast('Track added', '', 1200);
    },

    removeTrack(id) {
      if (NB.Project.tracks.length <= 1) { toast('Keep at least one track', 'warn'); return; }
      NB.History.push();
      NB.project.removeTrack(id);
      NB.Engine.ensureTrackBuses(NB.Project.tracks.length);
      NB.Engine.applyMix(NB.Project.tracks);
      NB.bus.emit('project:replaced');
      NB.Mixer.render();
      NB.Transport.refresh();
      NB.Persistence.saveSoon();
    },

    saveProjectFile() {
      const blob = new Blob([JSON.stringify(NB.project.projectFile(), null, 2)], { type: 'application/json' });
      NB.Wav.download(blob, `${slug(NB.Project.name)}.neonboom.json`);
      toast('Project file saved', 'ok', 1600);
    },

    openProjectFile() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.addEventListener('change', async () => {
        const file = input.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          NB.History.push();
          NB.project.loadProjectFile(text, NB.Engine);
          NB.Engine.ensureTrackBuses(NB.Project.tracks.length);
          NB.Engine.applyMix(NB.Project.tracks);
          $('#bpm').value = NB.Project.bpm;
          NB.bus.emit('project:replaced');
          NB.Timeline.zoomFit();
          NB.Persistence.saveSoon();
          toast('Project loaded', 'ok');
        } catch (e) {
          toast('Could not read that project file', 'err');
        }
      });
      input.click();
    },

    async exportWav(loopOnly) {
      const btn = $('#btnExport');
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'Rendering…';
      const t0 = performance.now();
      try {
        const { rendered, seconds } = await NB.Wav.renderArrangement({
          loopOnly: !!loopOnly,
          sampleLibrary: NB.Library.items,
          project: NB.Project,
          engine: NB.Engine,
          fx: NB.Fx.snapshot(),
        });
        const blob = NB.Wav.encodeWAV(rendered);
        const suffix = loopOnly ? '-loop' : '';
        NB.Wav.download(blob, `${slug(NB.Project.name)}${suffix}-${NB.Project.bpm}bpm.wav`);
        toast(`Rendered ${fmtSec(seconds)} of audio in ${((performance.now() - t0) / 1000).toFixed(1)}s`, 'ok', 3200);
      } catch (err) {
        console.error(err);
        toast('Export failed: ' + err.message, 'err', 4000);
      } finally {
        btn.disabled = false;
        btn.innerHTML = label;
      }
    },

    async exportStems() {
      const btn = $('#btnExport');
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'Rendering…';
      const t0 = performance.now();
      try {
        const stems = await NB.Wav.renderStems({
          sampleLibrary: NB.Library.items,
          project: NB.Project,
          engine: NB.Engine,
          fx: NB.Fx.snapshot(),
        });
        if (!stems.length) { toast('No clips to render', 'warn'); return; }
        const zip = await NB.Wav.zip(stems.map((s) => ({ name: s.name, blob: s.blob })));
        NB.Wav.download(zip, `${slug(NB.Project.name)}-stems.zip`);
        toast(`${stems.length} stems in ${((performance.now() - t0) / 1000).toFixed(1)}s`, 'ok', 3200);
      } catch (err) {
        console.error(err);
        toast('Stem export failed: ' + err.message, 'err', 4000);
      } finally {
        btn.disabled = false;
        btn.innerHTML = label;
      }
    },

    /* ----------------------------------------------------------- keyboard */
    wireKeyboard() {
      document.addEventListener('keydown', (e) => {
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) return;
        const mod = e.ctrlKey || e.metaKey;

        if (mod && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? NB.History.redo() : NB.History.undo(); return; }
        if (mod && e.code === 'KeyY') { e.preventDefault(); NB.History.redo(); return; }
        if (mod && e.code === 'KeyD') { e.preventDefault(); NB.Timeline.duplicateSelected(); return; }
        if (mod && e.code === 'KeyS') { e.preventDefault(); this.saveProjectFile(); return; }
        if (mod) return;

        switch (e.code) {
          case 'Space': e.preventDefault(); NB.Transport.toggle(); break;
          case 'KeyR': e.preventDefault(); NB.Transport.rewind(); break;
          case 'KeyL': e.preventDefault(); $('#btnLoop').click(); break;
          case 'KeyK': e.preventDefault(); $('#btnMetro').click(); break;
          case 'KeyS': e.preventDefault(); NB.Timeline.splitAtPlayhead(); break;
          case 'Delete': case 'Backspace': e.preventDefault(); NB.Timeline.deleteSelected(); break;
          case 'KeyQ': e.preventDefault(); NB.Timeline.quantize(); break;
          case 'KeyF': e.preventDefault(); NB.Timeline.zoomFit(); break;
          case 'KeyM': {
            e.preventDefault();
            const id = NB.Timeline.selectedTrackId;
            const t = NB.Project.tracks.find((x) => x.id === id) || NB.Project.tracks[0];
            if (t) { t.mute = !t.mute; NB.Engine.applyMix(NB.Project.tracks); NB.Timeline.rebuildHeaders(); NB.Mixer.render(); }
            break;
          }
          case 'ArrowLeft': e.preventDefault(); NB.Timeline.nudge(e.shiftKey ? -4 : -NB.Project.snap); break;
          case 'ArrowRight': e.preventDefault(); NB.Timeline.nudge(e.shiftKey ? 4 : NB.Project.snap); break;
          case 'Minus': case 'NumpadSubtract': NB.Timeline.zoomOut(); break;
          case 'Equal': case 'NumpadAdd': NB.Timeline.zoomIn(); break;
          case 'Escape': this.closeSheet(); break;
          default: {
            const key = e.key.toLowerCase();
            if (/^[0-9qw]$/.test(key)) NB.Pads.keyPress(key);
          }
        }
      });
    },

    /* ------------------------------------------------------------- install */
    wireInstall() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        this._installEvent = e;
        const b = $('#btnInstall');
        if (b) { b.hidden = false; b.addEventListener('click', () => { e.prompt(); b.hidden = true; }); }
      });
      /* The manifest is only attached over http(s): fetching it from file://
         is a guaranteed CORS console error for anyone who double-clicks the
         downloaded file, and it buys nothing there. */
      if (location.protocol.startsWith('http')) {
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = 'manifest.webmanifest';
        document.head.appendChild(link);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        }
      }
    },
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  NB.Shell = Shell;
})(window.NB = window.NB || {});

</script>
<script>
/* =========================================================================
   NEONBOOM · app.js
   Boot sequence: engine → synthesise the loop library (parallel) → mount UI
   → restore autosave (or load the demo on first run) → reveal.
   ========================================================================= */
(function (NB) {
  'use strict';
  const { $, toast } = NB.util;

  const LOOP_MANIFEST = [
    /* name, category, generator — order is stable so saved projects keep
       resolving to the same samples across versions */
    ['Boom Bap Kick', 'Drums', 'boomBapKick'],
    ['Snare + Clap', 'Drums', 'boomBapSnareClap'],
    ['Hi-Hat Roll', 'Drums', 'hatRoll'],
    ['808 Slide Bass', 'Bass', 'bassline808'],
    ['Synth Stab Chord', 'Synths', 'stabLoop'],
    ['Vinyl Scratch Hit', 'Scratch & FX', 'scratchOneShot'],
    ['Crash Accent', 'Scratch & FX', 'crashOneShot'],
    ['Trap Kick Pattern', 'Drums', 'trapKickPattern'],
    ['Four-on-Floor Kick', 'Drums', 'fourOnFloorKick'],
    ['Trap Snare + Ghosts', 'Drums', 'trapSnareGhosts'],
    ['Rimshot Pattern', 'Drums', 'rimshotPattern'],
    ['Trap Hat Rolls (32nd)', 'Drums', 'trapHatRolls'],
    ['Shaker Loop', 'Drums', 'shakerLoop'],
    ['Cowbell Pattern', 'Drums', 'cowbellPattern'],
    ['Tom Fill', 'Drums', 'tomFill'],
    ['Ride Cymbal Loop', 'Drums', 'rideLoop'],
    ['Sub Bass Drone', 'Bass', 'subBassDrone'],
    ['Trap 808 Pattern', 'Bass', 'trap808Pattern'],
    ['Arp Pluck Loop', 'Synths', 'arpPluckLoop'],
    ['Pad Swell', 'Synths', 'padSwell'],
    ['Bell Melody', 'Synths', 'bellMelody'],
    ['Scratch Loop', 'Scratch & FX', 'scratchLoopPattern'],
    ['Riser FX', 'Scratch & FX', 'riserFx'],
    ['Impact Hit', 'Scratch & FX', 'impactOneShot'],
    ['Vinyl Crackle Bed', 'Scratch & FX', 'vinylCrackle'],
    ['Boom Bap Full Loop', 'Drums', 'boomBapFull'],
    ['Dub Chord', 'Synths', 'dubChord'],
  ];

  const App = {
    version: '1.2.0',

    async boot() {
      const bar = $('#bootBar'), msg = $('#bootMsg');
      const set = (pct, text) => {
        bar.style.width = pct + '%';
        if (text) msg.textContent = text;
      };

      const T = { start: performance.now() };
      const mark = (k) => { T[k] = Math.round(performance.now() - T.start); };
      let hydrated = 0;
      set(4, 'starting audio engine…');
      NB.Engine = new NB.AudioEngine();
      const E = NB.Engine;

      mark('engine');

      /* ---------- which loops matter first ----------
         The demo beat and the first screenful of pads only need these. They are
         hydrated from cache (or synthesised) before the veil lifts; everything
         else arrives in the background. */
      const PRIORITY = new Set(['boomBapKick', 'boomBapSnareClap', 'hatRoll', 'bassline808',
        'stabLoop', 'arpPluckLoop', 'vinylCrackle', 'crashOneShot',
        'scratchOneShot', 'trapKickPattern', 'fourOnFloorKick', 'trapSnareGhosts',
        'rimshotPattern', 'trapHatRolls']);

      const idOf = (fn) => 'loop_' + fn;
      const register = (name, category, fn, i, buffer, beats) => {
        NB.Library.register({
          id: idOf(fn), name, buffer, category,
          color: NB.util.TRACK_COLORS[i % NB.util.TRACK_COLORS.length],
          beats,
        });
      };
      const hydrateRows = (rows) => {
        let n = 0;
        LOOP_MANIFEST.forEach(([name, category, fn], i) => {
          if (NB.Library.has(idOf(fn))) return;
          const row = rows.get(NB.LoopCache.key(idOf(fn)));
          if (!row) return;
          try {
            register(name, category, fn, i, NB.LoopCache.hydrate(row, E.ctx), row.beats);
            n++;
          } catch (err) { /* corrupt row: it will be re-synthesised */ }
        });
        return n;
      };

      const renderOne = async ([name, category, fn], i) => {
        if (NB.Library.has(idOf(fn))) return;
        try {
          const { buffer, beats } = await NB.Synth[fn].call(NB.Synth);
          register(name, category, fn, i, buffer, beats);
          NB.LoopCache.put(idOf(fn), buffer, beats);   // fire and forget
        } catch (err) {
          console.error('loop failed:', name, err);
        }
      };

      const runQueue = async (queue, workers) => {
        const q = queue.slice();
        await Promise.all(Array.from({ length: workers }, async () => {
          while (q.length) {
            const [entry, i] = q.shift();
            await renderOne(entry, i);
            done++;
            set(12 + (done / Math.max(1, totalPending)) * 72, `synthesising ${entry[0]}…`);
          }
        }));
      };

      const allEntries = LOOP_MANIFEST.map((entry, i) => [entry, i]);
      let done = 0;
      let totalPending = 0;

      /* ---------- storage, then the priority slice ---------- */
      set(8, 'restoring rendered loops…');
      try {
        await NB.Persistence.open();
        const priorityNames = LOOP_MANIFEST
          .filter(([, , fn]) => PRIORITY.has(fn))
          .map(([, , fn]) => idOf(fn));
        const rows = await NB.LoopCache.many(priorityNames);
        hydrated = hydrateRows(rows);
      } catch (err) {
        console.warn('storage unavailable — loops will render every boot', err);
      }
      mark('storage');

      const phase1 = allEntries.filter(([e]) => PRIORITY.has(e[2]) && !NB.Library.has(idOf(e[2])));
      const phase2 = allEntries.filter(([e]) => !PRIORITY.has(e[2]) && !NB.Library.has(idOf(e[2])));
      totalPending = phase1.length + phase2.length;

      if (hydrated) set(12, `${hydrated} loops restored from cache`);
      await runQueue(phase1, 6);
      mark('phase1');
      Object.assign(T, { hydrated, phase1: phase1.length, phase2: phase2.length });
      App.timings = T;   // live reference: later marks keep landing in it

      /* ---------- project + UI ---------- */
      set(86, 'building the workspace…');
      NB.project.initTracks(8);
      E.ensureTrackBuses(NB.Project.tracks.length);

      NB.Timeline.init();
      NB.Pads.init();
      NB.Mixer.mount($('#drawerBody'));
      NB.Fx.mount(document.createElement('div'));
      NB.Inspector.mount($('#inspector'));
      NB.Shell.init();
      mark('ui');

      /* ---------- restore ---------- */
      set(94, 'looking for your last session…');
      let restored = false;
      try {
        restored = await NB.Persistence.load(E);
      } catch (err) {
        console.warn('storage unavailable — autosave off', err);
      }

      if (restored) {
        if (NB.Project.fx) { Object.assign(NB.Fx.values, NB.Project.fx); NB.Fx.render(); }
        E.ensureTrackBuses(NB.Project.tracks.length);
        E.applyMix(NB.Project.tracks);
        $('#bpm').value = NB.Project.bpm;
        NB.bus.emit('project:replaced');
        NB.bus.emit('library:changed');
        NB.Timeline.zoomFit();
      } else {
        NB.project.buildDemo();
        E.ensureTrackBuses(NB.Project.tracks.length);
        E.applyMix(NB.Project.tracks);
        $('#bpm').value = NB.Project.bpm;
        NB.bus.emit('project:replaced');
        NB.Timeline.zoomFit();
        setTimeout(() => toast('Demo beat loaded — press space to play', 'ok', 3600), 700);
      }

      mark('restore');
      NB.Shell.syncLoopBtn();
      NB.Shell.openDrawer('mixer');

      /* ---------- the rest of the library, after the veil lifts ---------- */
      if (phase2.length) {
        setTimeout(async () => {
          let more = 0;
          try { more = hydrateRows(await NB.LoopCache.all()); } catch (e) {}
          if (more) { NB.bus.emit('library:changed'); NB.Pads.render(); }
          const stillMissing = allEntries.filter(([e]) => !NB.Library.has(idOf(e[2])));
          if (stillMissing.length) {
            totalPending = stillMissing.length; done = 0;
            await runQueue(stillMissing, 3);
            NB.bus.emit('library:changed');
            NB.Pads.render();
          }
          mark('phase2');
        }, 40);
      }

      mark('ready');
      set(100, 'ready');
      setTimeout(() => {
        $('#boot').classList.add('done');
        setTimeout(() => { $('#boot').style.display = 'none'; }, 320);
        NB.Timeline.resize();
        if (restored) toast('Restored your last session', '', 2200);
      }, 60);

      window.addEventListener('beforeunload', () => { NB.Persistence.save(); });

      /* expose for debugging / tests */
      window.NEONBOOM = NB;
    },
  };

  NB.App = App;
  window.addEventListener('DOMContentLoaded', () => {
    App.boot().catch((err) => {
      console.error(err);
      const msg = $('#bootMsg');
      if (msg) msg.textContent = 'Could not start: ' + err.message;
    });
  });
})(window.NB = window.NB || {});

</script>
</body>
</html>
