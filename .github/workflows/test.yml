name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install a known Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Install the harness
        run: npm install

      - name: Build the single-file bundle
        run: node scripts/build-standalone.mjs

      - name: Core suite
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/run.mjs

      - name: Features suite
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/extended.mjs

      - name: Layout regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/layout.mjs

      - name: Size budgets
        # The minified file is what people download, so it gets the tight budget.
        # The readable one is the source of truth and is allowed to be bigger.
        run: |
          MIN=$(stat -c%s dist/neonboom.min.html)
          SRC=$(stat -c%s dist/neonboom.html)
          echo "minified $MIN bytes ($((MIN/1024)) KB) · readable $SRC bytes ($((SRC/1024)) KB)"
          test "$MIN" -lt 221184
          test "$SRC" -lt 344064
