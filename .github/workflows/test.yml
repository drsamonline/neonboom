name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium + harness
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo snap install chromium
          npm install
      - name: Build standalone
        run: node scripts/build-standalone.mjs
      - name: Run headless suite
        env:
          CHROME_PATH: /usr/bin/chromium-browser
        run: node tests/run.mjs
      - name: Size budget
        run: |
          SIZE=$(stat -c%s dist/neonboom.html)
          echo "dist/neonboom.html = $SIZE bytes"
          test "$SIZE" -lt 230000
