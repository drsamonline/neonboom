/* =========================================================================
   NEONBOOM — design tokens
   Hardware-sampler chassis. Dark metal, amber LCD, per-track neon tags.
   ========================================================================= */
:root{
  /* surfaces */
  --bg-0:#08090b;
  --bg-1:#0f1216;
  --bg-2:#151a20;
  --bg-3:#1b212a;
  --bg-4:#232b36;
  --line:#242c36;
  --line-2:#333d4a;
  --line-3:#4a5666;

  /* ink */
  --ink-0:#eef2f6;
  --ink-1:#a3aebc;
  --ink-2:#6d7887;
  --ink-3:#4a5462;

  /* signal */
  --amber:#ffb020;
  --amber-soft:#ffd479;
  --amber-dim:#8a6420;
  --ok:#41d18a;
  --warn:#ffc24b;
  --danger:#ff5d5d;
  --focus:#ffb020;

  /* geometry */
  --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
  --tap:44px;               /* minimum touch target */
  --topbar-h:60px;
  --pad:260px;              /* pad rail width  */
  --inspect:288px;          /* inspector width */
  --heads:168px;            /* track header column */
  --track-h:66px;

  --mono:ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;

  --shadow-1:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 8px 24px rgba(0,0,0,.45);
  --glow-amber:0 0 0 1px rgba(255,176,32,.55), 0 0 18px rgba(255,176,32,.18);
}

/* touch vs pointer tuning: bigger controls where fingers are used */
@media (hover:none){
  :root{ --track-h:74px; }
}

<style>
/* =========================================================================
   NEONBOOM — application shell
   Layout: topbar / stage(pads | arrange | inspector) / drawer / mobile tabbar
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg-0); color:var(--ink-0);
  font-family:var(--sans); font-size:13px; line-height:1.35;
  overflow:hidden; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
input,select{font:inherit; color:inherit;}
::selection{background:var(--amber); color:#140d00;}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-track{background:var(--bg-0);}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:6px; border:2px solid var(--bg-0);}
::-webkit-scrollbar-thumb:hover{background:var(--line-3);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ---------------------------------------------------------------- buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:34px; padding:0 12px; border-radius:var(--r-sm);
  background:linear-gradient(180deg,var(--bg-3),var(--bg-2));
  border:1px solid var(--line-2); color:var(--ink-0);
  font-size:12px; font-weight:600; letter-spacing:.01em;
  box-shadow:var(--shadow-1); transition:border-color .12s, background .12s, transform .06s, color .12s;
  touch-action:manipulation; white-space:nowrap;
}
.btn:hover{border-color:var(--line-3); background:linear-gradient(180deg,var(--bg-4),var(--bg-3));}
.btn:active{transform:translateY(1px);}
.btn[disabled]{opacity:.45; pointer-events:none;}
.btn.primary{background:linear-gradient(180deg,#ffc247,var(--amber)); border-color:#c98a10; color:#1a1200; font-weight:800;}
.btn.primary:hover{background:linear-gradient(180deg,#ffd06a,#ffb020);}
.btn.ghost{background:transparent; box-shadow:none;}
.btn.ghost:hover{background:var(--bg-3);}
.btn.danger{color:var(--danger); border-color:#4a2b2b;}
.btn.danger:hover{background:#2a1a1a; border-color:var(--danger);}
.btn.on{background:linear-gradient(180deg,#3a2d10,#2a2008); border-color:var(--amber); color:var(--amber); box-shadow:var(--glow-amber);}
.btn.wide{width:100%;}
.btn.icon{padding:0; width:34px; min-width:34px;}
.btn svg{width:15px;height:15px;display:block;}

/* square transport keys — the tactile part */
.key{
  display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; padding:0; border-radius:9px;
  background:linear-gradient(180deg,#2b3441,#1a212a);
  border:1px solid var(--line-2); color:var(--ink-0);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 2px 0 rgba(0,0,0,.55);
  transition:transform .05s, border-color .12s, background .12s, box-shadow .12s;
  touch-action:manipulation;
}
.key:hover{border-color:var(--line-3);}
.key:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.55);}
.key svg{width:17px;height:17px;}
.key.play{width:52px; height:52px; border-radius:50%; background:linear-gradient(180deg,#2f3a48,#1b222b);}
.key.play svg{width:20px;height:20px;}
.key.play.on{background:linear-gradient(180deg,#ffc247,#e59a12); border-color:#c98a10; color:#160f00; box-shadow:0 0 20px rgba(255,176,32,.35);}
.key.rec.on{background:linear-gradient(180deg,#ff7a7a,#e04343); border-color:#b83a3a; color:#fff; box-shadow:0 0 18px rgba(255,93,93,.4);}
.key.on{border-color:var(--amber); color:var(--amber);}

/* ---------------------------------------------------------------- topbar */
#topbar{
  height:var(--topbar-h); flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:0 14px; background:linear-gradient(180deg,#181e26,#10151a);
  border-bottom:1px solid var(--line); position:relative; z-index:20;
}
#topbar::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,176,32,.35),transparent);}
.brand{display:flex; flex-direction:column; line-height:1; margin-right:4px;}
.brand b{font-size:15px; letter-spacing:.14em; font-weight:900; color:var(--amber);}
.brand b span{color:var(--ink-0);}
.brand em{font-style:normal; font-size:8.5px; letter-spacing:.22em; color:var(--ink-2); margin-top:4px; text-transform:uppercase;}
.transport{display:flex; align-items:center; gap:6px;}
.lcd{
  appearance:none; text-align:center; cursor:pointer;
  background:linear-gradient(180deg,#07090a,#0c1013);
  border:1px solid var(--line-2); border-radius:var(--r-sm);
  padding:5px 12px; min-width:118px; text-align:center; position:relative; overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 0 0 1px rgba(0,0,0,.6);
}
.lcd::after{content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px); opacity:.5;}
.lcd:hover{border-color:var(--line-3);}
.lcd b{
  display:block; font-family:var(--mono); font-size:16px; font-weight:600; letter-spacing:.06em;
  color:var(--amber); text-shadow:0 0 10px rgba(255,176,32,.45);
}
.lcd span{display:block; font-size:7.5px; letter-spacing:.18em; color:var(--amber-dim); margin-top:1px; white-space:nowrap;}
.tempo{display:flex; align-items:center; gap:2px; background:var(--bg-1); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:2px;}
.tempo input{
  width:52px; height:30px; text-align:center; background:transparent; border:0;
  font-family:var(--mono); font-size:15px; font-weight:600; color:var(--amber);
  -moz-appearance:textfield;
}
.tempo input::-webkit-outer-spin-button,.tempo input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.tempo .step{width:26px;height:30px;border:0;background:transparent;color:var(--ink-1);border-radius:4px;font-size:15px;line-height:1;}
.tempo .step:hover{background:var(--bg-3); color:var(--amber);}
.tempo .unit{font-size:8px; letter-spacing:.14em; color:var(--ink-3); padding-right:6px;}
.masterVu{display:flex; gap:2px; align-items:flex-end; height:26px; width:56px;
  padding:3px; background:var(--bg-0); border:1px solid var(--line); border-radius:4px;}
.masterVu i{flex:1; height:100%; background:#1d242c; border-radius:1px; transition:background .06s;}
.masterVu i.on{background:var(--ok); box-shadow:0 0 6px rgba(65,209,138,.45);}
.masterVu i.hot{background:var(--danger); box-shadow:0 0 6px rgba(255,93,93,.5);}
.topActions{display:flex; align-items:center; gap:6px; margin-left:auto;}
.pill{font-family:var(--mono); font-size:10px; color:var(--ink-2); border:1px solid var(--line);
  padding:3px 8px; border-radius:20px; white-space:nowrap;}

/* ---------------------------------------------------------------- stage */
#stage{flex:1; display:grid; grid-template-columns:var(--pad) minmax(0,1fr) var(--inspect); min-height:0;}
#app{display:flex; flex-direction:column; height:100dvh; height:100vh;}

/* ---------------------------------------------------------------- pads */
#padPanel{display:flex; flex-direction:column; min-height:0; background:var(--bg-1); border-right:1px solid var(--line);}
.panelHead{
  display:flex; align-items:center; gap:8px; padding:9px 12px; flex:0 0 auto;
  border-bottom:1px solid var(--line); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-1); font-weight:700;
}
.panelHead .count{font-family:var(--mono); letter-spacing:0; color:var(--ink-3); font-weight:400;}
.panelHead .spacer{flex:1;}
.chips{display:flex; gap:5px; padding:8px 10px 4px; flex-wrap:wrap; flex:0 0 auto;}
.chip{
  border:1px solid var(--line-2); background:var(--bg-2); color:var(--ink-1);
  border-radius:20px; padding:4px 10px; font-size:10.5px; font-weight:600; letter-spacing:.03em;
  min-height:28px; touch-action:manipulation;
}
.chip:hover{border-color:var(--line-3); color:var(--ink-0);}
.chip.on{background:var(--amber); border-color:var(--amber); color:#1a1200;}
.padGrid{
  flex:1; min-height:0; overflow-y:auto; display:grid; gap:8px; padding:8px 10px 10px;
  grid-template-columns:repeat(2,minmax(0,1fr)); align-content:start;
}
.pad{
  position:relative; display:flex; flex-direction:column; justify-content:space-between;
  min-height:74px; padding:8px 9px; border-radius:var(--r-md); overflow:hidden;
  background:linear-gradient(165deg,var(--bg-3),var(--bg-2) 70%);
  border:1px solid var(--line-2); text-align:left; touch-action:manipulation;
  transition:transform .07s, border-color .12s, box-shadow .12s;
  box-shadow:0 2px 6px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.04) inset;
}
.pad::before{content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 20% 0%,var(--pad-color,rgba(255,176,32,.18)),transparent 60%);
  opacity:.5;}
.pad:hover{border-color:var(--line-3); transform:translateY(-1px);}
.pad:active,.pad.hit{transform:scale(.97); border-color:var(--pad-color,var(--amber)); box-shadow:0 0 0 1px var(--pad-color,var(--amber)), 0 0 22px rgba(255,176,32,.22);}
.pad .pname{position:relative; font-size:11px; font-weight:700; line-height:1.2; z-index:1;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.pad .pwave{position:relative; height:26px; width:100%; z-index:1; opacity:.9;}
.pad .pcat{position:relative; z-index:1; font-size:8px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-2);
  display:flex; align-items:center; gap:5px;}
.pad .pcat i{width:5px;height:5px;border-radius:50%; background:var(--pad-color,var(--amber)); display:block;}
.pad .pkey{position:absolute; top:6px; right:7px; font-family:var(--mono); font-size:8px; color:var(--ink-3); z-index:1;}
.padBar{display:flex; gap:6px; padding:0 10px 10px; flex:0 0 auto;}

/* ---------------------------------------------------------------- arrange */
#arrange{display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg-0); position:relative;}
.arrangeBar{
  display:flex; align-items:center; gap:8px; padding:7px 10px; flex:0 0 auto;
  border-bottom:1px solid var(--line); background:var(--bg-1);
}
.segmented{display:flex; border:1px solid var(--line-2); border-radius:var(--r-sm); overflow:hidden;}
.segmented button{min-height:30px; padding:0 10px; border:0; background:var(--bg-2); color:var(--ink-1);
  font-size:11px; font-weight:700;}
.segmented button+button{border-left:1px solid var(--line-2);}
.segmented button.on{background:var(--bg-4); color:var(--amber);}
.zoomGrp{display:flex; align-items:center; gap:2px; background:var(--bg-2); border:1px solid var(--line-2); border-radius:var(--r-sm);}
.zoomGrp button{min-height:30px; min-width:30px; border:0; background:transparent; color:var(--ink-1); font-size:14px; font-weight:700;}
.zoomGrp button:hover{color:var(--amber);}
.zoomGrp span{font-family:var(--mono); font-size:10px; color:var(--ink-2); min-width:42px; text-align:center;}
.arrangeBar .spacer{flex:1;}
.arrangeBar .hint{font-size:10.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.arrangeHead{display:flex; flex:0 0 auto; height:30px; background:var(--bg-2); border-bottom:1px solid var(--line);}
.headSpacer{width:var(--heads); flex:0 0 auto; border-right:1px solid var(--line);
  display:flex; align-items:center; padding:0 10px; font-size:8.5px; letter-spacing:.16em; color:var(--ink-3);}
#ruler{display:block; flex:1; height:30px; touch-action:pan-x; cursor:pointer;}
.arrangeBody{flex:1; display:flex; min-height:0; position:relative;}
#trackHeads{
  width:var(--heads); flex:0 0 auto; overflow:hidden; background:var(--bg-1);
  border-right:1px solid var(--line); position:relative;
}
#trackHeadsInner{will-change:transform;}
#tlViewport{
  flex:1; min-width:0; overflow:auto; position:relative; background:var(--bg-0);
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
}
#tlSpacer{position:relative;}
#tlCanvas{position:absolute; top:0; left:0; display:block; will-change:transform; touch-action:pan-x pan-y;}
#tlViewport.edit #tlCanvas{touch-action:none; cursor:crosshair;}

/* track header rows */
.trackHead{
  display:flex; flex-direction:column; justify-content:center; gap:2px;
  padding:4px 8px; border-bottom:1px solid var(--line); position:relative;
  background:var(--bg-1); height:var(--track-h); cursor:pointer;
}
.trackHead.sel{background:var(--bg-3);}
.trackHead .thRow{display:flex; align-items:center; gap:6px; min-width:0;}
.trackHead .tag{width:3px; height:22px; border-radius:2px; flex:0 0 auto;}
.trackHead .tname{
  flex:1; min-width:0; background:transparent; border:1px solid transparent; border-radius:3px;
  color:var(--ink-0); font-size:11.5px; font-weight:700; padding:2px 3px;
}
.trackHead .tname:hover{background:var(--bg-2);}
.trackHead .tname:focus{background:var(--bg-2); border-color:var(--line-3); outline:none;}
.trackHead .num{font-family:var(--mono); font-size:8.5px; color:var(--ink-3);}
.trackHead .tgrip{
  background:none; border:0; color:var(--ink-3); font-size:12px; line-height:1;
  padding:0; cursor:grab; touch-action:none; flex:0 0 auto;
  min-width:14px; min-height:14px;
}
.trackHead .tgrip:hover{color:var(--amber);}
.trackHead .tgrip:active{cursor:grabbing;}
/* touch: a 30 px hit box without growing the row (negative margins absorb it) */
@media (max-width:860px){
  .trackHead .tgrip{min-width:30px; min-height:30px; margin:-6px -2px -6px -6px; font-size:15px;}
}
.trackHead .tbtn{
  width:24px; height:22px; border-radius:3px; border:1px solid var(--line-2);
  background:var(--bg-2); color:var(--ink-2); font-size:9px; font-weight:800; padding:0;
  display:flex; align-items:center; justify-content:center; touch-action:manipulation;
}
.trackHead .tbtn.m.on{background:var(--danger); border-color:var(--danger); color:#fff;}
.trackHead .tbtn.s.on{background:var(--amber); border-color:var(--amber); color:#1a1200;}
.trackHead .meter{flex:1; height:4px; border-radius:2px; background:var(--bg-4); overflow:hidden; min-width:20px;}
.trackHead .meter i{display:block; height:100%; width:0%; background:var(--ok); transition:width .07s linear;}
.trackHead .vol{width:100%; height:10px; margin:0;}
.trackHead .vol::-webkit-slider-runnable-track{height:3px;}
.trackHead .vol::-webkit-slider-thumb{width:9px; height:9px; margin-top:-4px;}
.trackHead .vol::-moz-range-thumb{width:9px;height:9px;}

/* ---------------------------------------------------------------- inspector */
#inspector{
  display:flex; flex-direction:column; min-height:0; background:var(--bg-1);
  border-left:1px solid var(--line); overflow-y:auto;
}
.insp-empty{padding:26px 18px; text-align:center; color:var(--ink-2); font-size:12px; line-height:1.6;}
.insp-empty b{display:block; color:var(--ink-1); margin-bottom:6px; font-size:13px;}
.insp-card{padding:12px; border-bottom:1px solid var(--line);}
.insp-card h4{margin:0 0 10px; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-2); font-weight:700;
  display:flex; justify-content:space-between; align-items:center;}
.insp-title{font-size:13px; font-weight:700; margin-bottom:2px; word-break:break-word;}
.insp-sub{font-family:var(--mono); font-size:10px; color:var(--ink-2); margin-bottom:8px;}
.insp-wave{width:100%; height:56px; display:block; background:var(--bg-0); border:1px solid var(--line); border-radius:var(--r-sm); margin-bottom:10px;}
.knobRow{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
.knobRow label{font-size:10.5px; color:var(--ink-1); flex:0 0 54px;}
.knobRow input[type=range]{flex:1; min-width:0;}
.knobRow .val{font-family:var(--mono); font-size:10px; color:var(--ink-0); width:44px; text-align:right;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
.statRow{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-2); padding:3px 0;}
.statRow b{font-family:var(--mono); color:var(--ink-0); font-weight:500;}

/* range inputs */
input[type=range]{
  -webkit-appearance:none; appearance:none; background:transparent; height:20px; width:100%; margin:0;
  touch-action:none;
}
input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:var(--bg-4); border:1px solid var(--line);}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:14px; height:14px; margin-top:-6px; border-radius:50%;
  background:linear-gradient(180deg,#ffd06a,var(--amber)); border:1px solid #a4700f; box-shadow:0 1px 3px rgba(0,0,0,.5);
}
input[type=range]::-moz-range-track{height:4px; border-radius:2px; background:var(--bg-4); border:1px solid var(--line);}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--amber);border:1px solid #a4700f;}
input[type=number],input[type=text],select{
  background:var(--bg-2); border:1px solid var(--line-2); border-radius:var(--r-xs);
  padding:6px 8px; min-height:32px; font-family:var(--mono); font-size:12px;
}
select{cursor:pointer;}

/* ---------------------------------------------------------------- drawer */
#drawer{
  flex:0 0 auto; background:var(--bg-1); border-top:1px solid var(--line);
  display:flex; flex-direction:column; max-height:36vh; min-height:0;
}
#drawer[data-open="false"] .drawerBody{display:none;}
.drawerTabs{display:flex; gap:0; flex:0 0 auto; border-bottom:1px solid var(--line); overflow-x:auto;}
.drawerTabs button{
  border:0; background:transparent; color:var(--ink-2); font-size:11px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; padding:9px 14px; border-bottom:2px solid transparent;
  min-height:38px;
}
.drawerTabs button.on{color:var(--amber); border-bottom-color:var(--amber); background:var(--bg-2);}
.drawerBody{overflow-y:auto; padding:12px; min-height:0;}

/* mixer strips */
.mixRow{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; align-items:flex-start;}
.mstrip{
  width:78px; flex:0 0 auto; background:var(--bg-2); border:1px solid var(--line);
  border-radius:var(--r-md); padding:7px 6px; display:flex; flex-direction:column; gap:5px; align-items:center;
}
.mstrip.sel{border-color:var(--amber);}
.mstrip .mname{font-size:9.5px; font-weight:700; text-align:center; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mstrip .mtrk{font-family:var(--mono); font-size:8px; color:var(--ink-3);}
.mstrip .mfader{width:22px; height:86px; writing-mode:vertical-lr; direction:rtl; -webkit-appearance:none; appearance:none;}
.mstrip .mfader::-webkit-slider-runnable-track{width:4px; height:100%; background:var(--bg-4); border:1px solid var(--line); border-radius:2px;}
.mstrip .mfader::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:12px; border-radius:2px;
  background:linear-gradient(180deg,#5b6675,#3a4350); border:1px solid #6b7787; margin-left:-9px;}
.mstrip .mval{font-family:var(--mono); font-size:9px; color:var(--ink-1);}
.mstrip .mpan{width:100%;}
.mstrip .msend{display:flex; align-items:center; gap:3px; width:100%;}
.mstrip .msend b{font-size:8px; color:var(--ink-3); font-weight:700; width:7px; flex:0 0 auto;}
.mstrip .msend input{flex:1; min-width:0; height:14px;}
.mstrip .msend input::-webkit-slider-runnable-track{height:3px;}
.mstrip .msend input::-webkit-slider-thumb{width:8px; height:8px; margin-top:-3px;}
.mstrip .msend input::-moz-range-thumb{width:8px;height:8px;}
.mstrip .mbtns{display:flex; gap:4px; width:100%;}
.mstrip .mbtns .tbtn{flex:1; height:22px; font-size:9px; font-weight:800; border-radius:3px;
  border:1px solid var(--line-2); background:var(--bg-3); color:var(--ink-2);}
.mstrip .mbtns .tbtn.m.on{background:var(--danger); border-color:var(--danger); color:#fff;}
.mstrip .mbtns .tbtn.s.on{background:var(--amber); border-color:var(--amber); color:#1a1200;}
.mstrip .mstripMeter{width:100%; height:4px; background:var(--bg-4); border-radius:2px; overflow:hidden;}
.mstrip .mstripMeter i{display:block; height:100%; width:0%; background:var(--ok);}

/* fx modules */
.fxGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px;}
.fxModule{background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 12px;}
.fxModule h5{margin:0 0 10px; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber);
  display:flex; justify-content:space-between; align-items:center; font-weight:700;}
.toggleChip{font-size:8.5px; border:1px solid var(--line-2); border-radius:10px; padding:2px 7px; color:var(--ink-2);
  letter-spacing:.08em; cursor:pointer; background:var(--bg-3);}
.toggleChip.on{background:var(--amber); border-color:var(--amber); color:#1a1200;}

.histRow{display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%;
  background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:9px 12px; margin-bottom:5px; color:var(--ink-0); font-size:12px; text-align:left; min-height:38px;}
.histRow:hover{border-color:var(--amber); color:var(--amber);}
.histStep{font-family:var(--mono); font-size:10px; color:var(--ink-3);}

/* export + help panes */
.pane{max-width:640px;}
.pane h3{margin:0 0 6px; font-size:14px;}
.pane p{margin:0 0 12px; color:var(--ink-1); font-size:12px; line-height:1.6;}
.pane .row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.kbd{display:inline-block; font-family:var(--mono); font-size:10px; background:var(--bg-3);
  border:1px solid var(--line-2); border-bottom-width:2px; border-radius:4px; padding:1px 6px; margin-right:4px;}
.shortcuts{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:6px 18px;}
.shortcuts div{display:flex; justify-content:space-between; gap:10px; font-size:11.5px; color:var(--ink-1);
  padding:4px 0; border-bottom:1px dashed var(--line);}

/* ---------------------------------------------------------------- tabbar (mobile) */
#tabbar{display:none;}
@media (max-width:900px){
  .masterVu{display:none;}
  #saveState{display:none;}
  .brand em{display:none;}
  .lcd{min-width:104px;}
  #topbar{gap:8px;}
}
@media (max-width:860px){
  #toasts{bottom:calc(70px + env(safe-area-inset-bottom));}
  #tabbar{
    display:grid; grid-template-columns:repeat(5,1fr); flex:0 0 auto;
    background:linear-gradient(180deg,#141a21,#0d1216); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
    position:relative; z-index:30;
  }
  #tabbar button{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    min-height:56px; border:0; background:transparent; color:var(--ink-2); font-size:9.5px;
    font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:6px 2px;
  }
  #tabbar button svg{width:20px;height:20px;}
  #tabbar button.on{color:var(--amber);}
  #tabbar button.on::before{content:''; position:absolute; top:0; width:34px; height:2px; background:var(--amber);}
}

/* ---------------------------------------------------------------- sheet + toast */
#scrim{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px); z-index:60; display:none;}
#scrim.on{display:block;}
#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61; display:none;
  background:var(--bg-1); border-top:1px solid var(--line-2); border-radius:16px 16px 0 0;
  padding:8px 12px calc(14px + env(safe-area-inset-bottom)); box-shadow:0 -14px 40px rgba(0,0,0,.6);
  max-height:78vh; overflow-y:auto;
}
#sheet.on{display:block; animation:sheetIn .18s ease-out;}
@keyframes sheetIn{from{transform:translateY(18px);opacity:.4;}to{transform:none;opacity:1;}}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line-3);margin:2px auto 10px;}
#sheet h4{margin:0 0 10px; font-size:13px;}
#sheet .sheetRow{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); min-height:46px;}
#sheet .sheetRow label{flex:0 0 84px; font-size:11.5px; color:var(--ink-1);}
#sheet .sheetRow input[type=range]{flex:1;}
#sheet .sheetRow .val{font-family:var(--mono); font-size:10px; width:46px; text-align:right;}
#sheet .sheetBtns{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
#toasts{position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:80; display:flex;
  flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(92vw,420px);}
.toast{
  background:rgba(22,28,36,.96); border:1px solid var(--line-2); color:var(--ink-0);
  border-radius:var(--r-md); padding:9px 14px; font-size:12px; box-shadow:var(--shadow-2);
  animation:toastIn .16s ease-out; max-width:100%;
}
.toast.ok{border-color:#2e6b4b;} .toast.warn{border-color:#6b5726;} .toast.err{border-color:#6b2e2e;}
@keyframes toastIn{from{transform:translateY(8px);opacity:0;}to{transform:none;opacity:1;}}

/* ---------------------------------------------------------------- boot veil */
#boot{
  position:fixed; inset:0; z-index:100; background:radial-gradient(circle at 50% 40%,#141a21,#06070a 70%);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
  transition:opacity .35s;
}
#boot.done{opacity:0; pointer-events:none;}
#boot .logo{font-family:var(--mono); font-size:26px; letter-spacing:.3em; color:var(--amber);
  text-shadow:0 0 26px rgba(255,176,32,.45);}
#boot .bar{width:min(260px,60vw); height:3px; background:var(--bg-3); border-radius:2px; overflow:hidden;}
#boot .bar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#8a6420,var(--amber)); transition:width .18s;}
#boot .msg{font-family:var(--mono); font-size:10.5px; color:var(--ink-2); letter-spacing:.06em; min-height:14px;}
#boot .skip{position:absolute; bottom:26px; font-size:10.5px; color:var(--ink-3);}

/* ---------------------------------------------------------------- responsive */
@media (max-width:1280px){
  :root{--pad:232px; --inspect:252px;}
}
@media (max-width:1100px){
  #stage{grid-template-columns:var(--pad) minmax(0,1fr);}
  #inspector{display:none;}
  .arrangeBar .hint{display:none;}
}
@media (max-width:860px){
  :root{--topbar-h:56px;}
  #stage{grid-template-columns:1fr; grid-template-rows:minmax(0,1fr);}
  #app{padding-bottom:0;}
  /* one view at a time */
  #padPanel,#arrange{display:none; min-height:0;}
  body[data-view="pads"] #padPanel{display:flex;}
  body[data-view="arrange"] #arrange{display:flex;}
  #drawer{display:none; position:fixed; left:0; right:0; bottom:56px; top:auto; max-height:64vh;
    border-radius:14px 14px 0 0; box-shadow:0 -10px 30px rgba(0,0,0,.6); z-index:40;}
  #drawer.mobileOpen{display:flex;}
  .padGrid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; padding:10px;}
  .pad{min-height:88px;}
  .brand em{display:none;}
  .masterVu{display:none;}
  .arrangeBar{padding:6px 8px;}
}
@media (max-width:860px){
  /* fingers, not cursors: every hit target grows with the tabbed layout */
  .btn{min-height:40px; padding:0 14px;}
  .key{width:40px; height:40px;}
  .key.play{width:48px; height:48px;}
  .trackHead .tbtn{width:34px; height:34px; font-size:11px;}
  .trackHead .vol{height:26px;}
  .trackHead .vol::-webkit-slider-thumb{width:14px; height:14px; margin-top:-6px;}
  .trackHead .num{display:none;}
  .segmented button{min-height:36px;}
  .zoomGrp button{min-height:36px; min-width:36px;}
  .chip{min-height:32px;}
  .drawerTabs button{min-height:44px;}
  input[type=range]{height:28px;}
  input[type=range]::-webkit-slider-thumb{width:18px;height:18px;margin-top:-8px;}
}
@media (max-width:680px){
  #topbar{gap:6px; padding:0 8px;}
  #btnUndo,#btnRedo,#btnHelp{display:none;}
  .tempo{display:none;}
  .lcd span{font-size:8px;}
  #btnRewind{display:none;}
  .brand b{font-size:12px; letter-spacing:.1em;}
  .transport{gap:4px;}
  .key{width:36px;height:36px;}
  .key.play{width:44px;height:44px;}
  .lcd{min-width:86px; padding:4px 8px;}
  .lcd:hover{border-color:var(--line-3);}
.lcd b{font-size:13px;}
  .lcd span{font-size:6.5px;}
  .tempo input{width:40px; font-size:13px;}
  .tempo .unit{display:none;}
  .topActions .desktopOnly{display:none;}
  .padGrid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .pad{min-height:82px; padding:7px;}
  .pad .pname{font-size:10px;}
  .arrangeBar{gap:6px; flex-wrap:nowrap; overflow-x:auto;}
  .zoomGrp button{min-width:34px;}
  .headSpacer{width:112px;}
  :root{--heads:112px; --track-h:72px;}
  .drawerTabs button{padding:10px 12px;}
  .btn{min-height:40px;}
  .key{min-height:36px;}
}
@media (max-width:430px){
  .brand{display:none;}
  .lcd{min-width:80px;}
  .topActions .pill{display:none;}
  .key{width:38px;height:38px;}
  .key.play{width:46px;height:46px;}
  #btnMetro{display:none;}
}
@media (hover:none){
  .btn{min-height:var(--tap); padding:0 14px;}
  .key{width:44px; height:44px;}
  .key.play{width:54px; height:54px;}
  .chip{min-height:34px;}
  .trackHead .tbtn{width:34px;height:34px;}
  .segmented button{min-height:36px;}
  .zoomGrp button{min-height:36px; min-width:36px;}
  .drawerTabs button{min-height:44px;}
  input[type=range]{height:30px;}
  input[type=range]::-webkit-slider-thumb{width:20px;height:20px;margin-top:-9px;}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important;} }


/* ---------------------------------------------------------------- palette
   data-palette="safe" swaps the neon track colours for a colour-blind-safe
   set (Okabe–Ito derived) and calms the accents. Track colours live in JS, so
   the token below is read by util.TRACK_COLORS via CSS custom properties. */
:root[data-palette="safe"]{
  --amber:#e69f00;
  --amber-soft:#f0c46b;
  --ok:#009e73;
  --danger:#d55e00;
  --warn:#f0e442;
}

/* ------------------------------------------------------------- text size */
:root[data-textsize="large"]{ font-size:15px; }
:root[data-textsize="large"] .trackHead .tname{font-size:12.5px;}
:root[data-textsize="large"] .pad .pname{font-size:12px;}
:root[data-textsize="large"] .insp-title{font-size:14px;}
:root[data-textsize="large"] .btn{font-size:13px;}

/* --------------------------------------------------------- template rows */
.tplRow{display:flex; flex-direction:column; gap:3px; width:100%; text-align:left;
  background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r-md);
  padding:12px 14px; margin-bottom:8px; color:var(--ink-0); min-height:60px;}
.tplRow:hover{border-color:var(--amber);}
.tplName{font-size:13px; font-weight:700; display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
.tplName b{font-family:var(--mono); font-size:9.5px; font-weight:400; color:var(--ink-3);}
.tplBlurb{font-size:11.5px; color:var(--ink-2);}


/* ------------------------------------------------------------- scene strip */
#sceneBar{
  display:flex; align-items:center; gap:6px; flex:0 0 auto; overflow-x:auto;
  padding:6px 10px; background:var(--bg-1); border-bottom:1px solid var(--line);
  scrollbar-width:thin;
}
.sceneChip{
  display:flex; align-items:center; gap:6px; flex:0 0 auto;
  background:var(--bg-2); border:1px solid var(--line-2); color:var(--ink-1);
  border-radius:20px; padding:5px 12px; font-size:11.5px; font-weight:600;
  min-height:30px; white-space:nowrap; touch-action:manipulation;
}
.sceneChip:hover{border-color:var(--amber); color:var(--amber);}
.sceneChip.active{background:var(--amber); border-color:var(--amber); color:#1a1200;}
.sceneChip b{font-family:var(--mono); font-size:9px; font-weight:400; opacity:.7;}
.sceneAdd{
  display:flex; align-items:center; gap:5px; flex:0 0 auto; margin-left:auto;
  background:transparent; border:1px dashed var(--line-2); color:var(--ink-2);
  border-radius:20px; padding:5px 12px; font-size:11px; font-weight:700; min-height:30px;
}
.sceneAdd:hover{border-color:var(--amber); color:var(--amber);}
#sceneBar .empty{font-size:11px; color:var(--ink-3); padding-left:2px;}
@media (max-width:860px){ .sceneChip,.sceneAdd{min-height:36px;} }


/* ------------------------------------------------------------ busy overlay */
#busyBox{
  position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  background:rgba(6,8,10,.72); backdrop-filter:blur(2px); z-index:60;
}
#busyBox.on{display:flex;}
.busyInner{
  display:flex; flex-direction:column; align-items:center; gap:10px;
  background:var(--bg-2); border:1px solid var(--line-2); border-radius:var(--r-lg);
  padding:22px 28px; min-width:220px; text-align:center;
}
.busySpin{
  width:26px; height:26px; border-radius:50%;
  border:2px solid var(--line-2); border-top-color:var(--amber);
  animation:busySpin .8s linear infinite;
}
@keyframes busySpin{to{transform:rotate(360deg);}}
.busyLabel{font-size:12.5px; font-weight:600;}
.busyTime{font-family:var(--mono); font-size:11px; color:var(--ink-3);}
@media (prefers-reduced-motion:reduce){ .busySpin{animation:none; border-top-color:var(--amber);} }

/* record button */
#btnRecord.rec{background:var(--danger); border-color:var(--danger); color:#fff;}

</style>
</head>
<body data-view="pads">

<!-- ================= BOOT ================= -->
<div id="boot">
  <div class="logo">NEONBOOM</div>
  <div class="bar"><i id="bootBar"></i></div>
  <div class="msg" id="bootMsg">starting audio engine…</div>
  <div class="skip">everything is synthesised locally — nothing is downloaded</div>
</div>

<div id="app">

  <!-- ================= TOPBAR ================= -->
  <header id="topbar">
    <div class="brand"><b>NEON<span>BOOM</span></b><em>beat workstation</em></div>

    <div class="transport" role="group" aria-label="Transport">
      <button class="key" id="btnRewind" title="Rewind (R)" aria-label="Rewind">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5v14L8 12z" fill="currentColor" stroke="none"/><rect x="4" y="5" width="2.6" height="14" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="key play" id="btnPlay" title="Play / Pause (Space)" aria-label="Play">
        <svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      </button>
      <button class="key" id="btnStop" title="Stop" aria-label="Stop">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
      </button>
      <button class="key" id="btnLoop" title="Loop region (L)" aria-label="Loop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9a4 4 0 014-4h9l-2.5-2.5M20 15a4 4 0 01-4 4H7l2.5 2.5"/></svg>
      </button>
      <button class="key" id="btnMetro" title="Metronome (K)" aria-label="Metronome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4l6 15H6L12 4z"/><path d="M12 9l3.4 8.5"/><path d="M4 20h16"/></svg>
      </button>
    </div>

    <button class="lcd" id="lcd" aria-live="off" title="Tempo &amp; transport settings"><b id="lcdPos">001:1:1</b><span id="lcdSub">BAR · BEAT · 16TH</span></button>

    <div class="tempo" title="Tempo">
      <button class="step" data-tempo="-1" aria-label="Slower">−</button>

      <span class="unit">BPM</span>
    </div>

    <div class="masterVu" id="masterVu" aria-hidden="true"></div>

    <div class="topActions">
      <button class="btn icon" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h9a6 6 0 010 12h-3"/></svg>
      </button>
      <button class="btn icon" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a6 6 0 000 12h3"/></svg>
      </button>
      <span class="pill desktopOnly" id="saveState">saved</span>
      <button class="btn" id="btnExport" title="Render arrangement to WAV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
        <span class="desktopOnly">WAV</span>
      </button>
      <button class="btn icon" id="btnHelp" title="Shortcuts &amp; about" aria-label="Help">?</button>
    </div>
  </header>

  <!-- ================= STAGE ================= -->
  <main id="stage">

    <!-- ---------- pads ---------- -->
    <aside id="padPanel" aria-label="Sample pads">
      <div class="panelHead">
        <span>Pads</span><span class="count" id="padCount"></span>
        <span class="spacer"></span>
        <button class="chip" id="btnRecArm" title="Arm: pad taps drop clips at the playhead">REC</button>
      </div>
      <div class="chips" id="padChips"></div>
      <div class="padGrid" id="padGrid"></div>

<script>
/* =========================================================================
   NEONBOOM · core/util.js
   Tiny helpers, grid math, toasts, haptics. No dependencies.
   ========================================================================= */
(function (NB) {
  'use strict';

  const $  = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp  = (a, b, t) => a + (b - a) * t;

  const uid = (() => {
    let n = 1;
    return (p = 'id') => `${p}_${(n++).toString(36)}${Math.random().toString(36).slice(2, 5)}`;
  })();

  const deepClone = (o) => JSON.parse(JSON.stringify(o));

  const debounce = (fn, ms) => {
    let t = 0;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  };

  const rafThrottle = (fn) => {
    let queued = false, lastArgs;
    return (...args) => {
      lastArgs = args;
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; fn(...lastArgs); });
    };
  };

  /* One requestAnimationFrame loop, throttled to ~30 fps, shared by every
     meter and readout. Three setInterval timers used to do this job. */
  const Frame = {
    _fns: [], _raf: 0, _last: 0, _minGap: 33,
    add(fn) {
      this._fns.push(fn);
      if (!this._raf) this._start();
      return fn;
    },
    _start() {
      const loop = (t) => {
        this._raf = requestAnimationFrame(loop);
        if (t - this._last < this._minGap) return;
        this._last = t;
        for (let i = 0; i < this._fns.length; i++) {
          try { this._fns[i](t); } catch (e) { /* a dead meter must not kill the loop */ }
        }
      };
      this._raf = requestAnimationFrame(loop);
    },
  };

  const isTouch = () => matchMedia('(hover:none)').matches;
  const reducedMotion = () => matchMedia('(prefers-reduced-motion:reduce)').matches;

  const haptic = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  /* ---------- musical grid --------------------------------------------- */
  const REF_BPM = 90;              // procedural loops are rendered at this tempo
  const BEATS_PER_BAR = 4;
  const SIX_PER_BAR = 16;          // 4/4, 16th-note grid
  const PROJECT_BARS = 64;
  const PX_PER_SIX = 18;           // base pixels per 16th at zoom 1

  const Grid = {
    spSix(bpm) { return (60 / bpm) / 4; },
    sixToSec(sx, bpm) { return sx * Grid.spSix(bpm); },
    secToSix(s, bpm) { return s / Grid.spSix(bpm); },
    toBBT(sx) {
      const s = Math.max(0, sx);
      return {
        bar: Math.floor(s / SIX_PER_BAR) + 1,
        beat: Math.floor((s % SIX_PER_BAR) / 4) + 1,
        six: Math.floor(s % 4) + 1,
      };
    },
    fmtBBT(sx) {
      const { bar, beat, six } = Grid.toBBT(sx);
      return `${String(bar).padStart(3, '0')}:${beat}:${six}`;
    },
    fmtBars(sx) {
      const bars = sx / SIX_PER_BAR;
      return Number.isInteger(bars) ? `${bars} bar${bars === 1 ? '' : 's'}` : `${bars.toFixed(2)} bars`;
    },
  };

  /* Okabe–Ito derived, colour-blind-safe alternative palette */
  const SAFE_COLORS = ['#0072b2', '#e69f00', '#009e73', '#cc79a7', '#56b4e9', '#d55e00',
    '#f0e442', '#8c6bb1', '#4daf4a', '#a6761d', '#1b9e77', '#7570b3',
    '#66a61e', '#e7298a', '#e6ab02', '#666666'];

  const TRACK_COLORS = ['#4fd1c5', '#e85d9c', '#b4e61d', '#ff9f43', '#5b8def', '#ef5b5b',
    '#a56bff', '#2dd4bf', '#f2c94c', '#ff7a90', '#6fcf97', '#9b8cff',
    '#ff6b9d', '#3ddc97', '#ffb020', '#7c8cff'];

  /* Track colours are stored per track, so switching palettes has to rewrite
     them. `paletteColor(i)` is what new tracks and the switcher use. */
  function paletteColor(i) {
    const safe = document.documentElement.dataset.palette === 'safe';
    const list = safe ? SAFE_COLORS : TRACK_COLORS;
    return list[i % list.length];
  }

  function applyPaletteToProject(project) {
    project.tracks.forEach((t, i) => { t.color = paletteColor(i); });
  }

  /* ---------- toasts ---------------------------------------------------- */
  let toastHost;
  function toast(msg, kind = '', ms = 2200) {
    toastHost = toastHost || $('#toasts');
    if (!toastHost) return;
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = msg;
    toastHost.appendChild(el);
    while (toastHost.children.length > 3) toastHost.firstChild.remove();
    setTimeout(() => {
      el.style.transition = 'opacity .25s, transform .25s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      setTimeout(() => el.remove(), 260);
    }, ms);
  }

  /* ---------- tiny DOM builder ----------------------------------------- */
  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    (Array.isArray(children) ? children : children ? [children] : []).forEach(c => {
      if (c == null) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  }

  const fmtDb = (v) => (v > 0 ? '+' : '') + v.toFixed(1) + ' dB';
  const fmtPct = (v) => Math.round(v * 100) + '%';
  const fmtSec = (s) => {
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2, '0')}`;
  };

  /* safe filename */
  const slug = (s) => (s || 'neonboom').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48);

  NB.util = { $, $$, clamp, lerp, uid, deepClone, debounce, rafThrottle, isTouch, reducedMotion,
    haptic, toast, el, fmtDb, fmtPct, fmtSec, slug, Frame, Grid, TRACK_COLORS, SAFE_COLORS,
    paletteColor, applyPaletteToProject, REF_BPM, SIX_PER_BAR, PROJECT_BARS, PX_PER_SIX };
})(window.NB = window.NB || {});

</script>
<script>
/* =========================================================================
   NEONBOOM · audio/synth.js
   Procedural loop library. Every loop is rendered once, offline, into a real
   AudioBuffer at REF_BPM, so afterwards it behaves exactly like an imported
   sample (peaks, trim, tempo-sync via playbackRate).
   ========================================================================= */
(function (NB) {
  'use strict';
  const { REF_BPM } = NB.util;

  const Synth = {
    /* render a patch into a stereo buffer */
    async render(seconds, scheduleFn) {
      const rate = 44100;
      const oac = new OfflineAudioContext(2, Math.ceil(seconds * rate), rate);
      scheduleFn(oac);
      return oac.startRendering();
    },

    noiseBuffer(ctx, seconds) {
      const len = Math.max(1, Math.floor(ctx.sampleRate * seconds));
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    },

    /* ---------- one-shot voices ---------- */
    kickHit(ctx, t, dest, pitch = 150) {
      const osc = ctx.createOscillator(); osc.type = 'sine';
      const g = ctx.createGain();
      osc.frequency.setValueAtTime(pitch, t);
      osc.frequency.exponentialRampToValueAtTime(38, t + 0.14);
      g.gain.setValueAtTime(1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      osc.connect(g); g.connect(dest);
      osc.start(t); osc.stop(t + 0.34);
    },
    snareHit(ctx, t, dest) {
      const noise = ctx.createBufferSource(); noise.buffer = this.noiseBuffer(ctx, 0.2);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.7;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(1, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      noise.connect(bp); bp.connect(ng); ng.connect(dest);
      const osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = 180;
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.6, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(og); og.connect(dest);
      noise.start(t); noise.stop(t + 0.2); osc.start(t); osc.stop(t + 0.13);
    },
    clapHit(ctx, t, dest) {
      for (let i = 0; i < 3; i++) {
        const off = t + i * 0.011;
        const noise = ctx.createBufferSource(); noise.buffer = this.noiseBuffer(ctx, 0.09);
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 4;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.5, off); g.gain.exponentialRampToValueAtTime(0.001, off + 0.08);
        noise.connect(bp); bp.connect(g); g.connect(dest); noise.start(off); noise.stop(off + 0.09);
      }
    },
    hatHit(ctx, t, dest, open = false) {
      const noise = ctx.createBufferSource(); noise.buffer = this.noiseBuffer(ctx, open ? 0.35 : 0.06);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.32 : 0.05));
      noise.connect(hp); hp.connect(g); g.connect(dest);
      noise.start(t); noise.stop(t + (open ? 0.35 : 0.07));
    },
    crashHit(ctx, t, dest) {
      const noise = ctx.createBufferSource(); noise.buffer = this.noiseBuffer(ctx, 1.2);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4000;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
      noise.connect(hp); hp.connect(g); g.connect(dest); noise.start(t); noise.stop(t + 1.2);
    },
    bass808(ctx, t, dur, dest, freq) {
      const osc = ctx.createOscillator(); osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.9, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t + dur + 0.05);

      /* octave-up saturated harmonic: makes the note audible on laptop/phone
         speakers that cannot reproduce the 40-60 Hz fundamental at all. */
      const osc2 = ctx.createOscillator(); osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2, t);
      const shaper = ctx.createWaveShaper();
      const curve = new Float32Array(256);
      for (let i = 0; i < 256; i++) { const x = (i / 255) * 2 - 1; curve[i] = Math.tanh(x * 2.2); }
      shaper.curve = curve; shaper.oversample = '2x';
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.linearRampToValueAtTime(0.35, t + 0.015);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.05, dur * 0.8));
      osc2.connect(shaper); shaper.connect(g2); g2.connect(dest);
      osc2.start(t); osc2.stop(t + dur + 0.05);
    },
    stabChord(ctx, t, dur, dest, freqs) {
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator(); osc.type = i === 0 ? 'sawtooth' : 'square';
        osc.frequency.value = f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.22, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
        osc.connect(lp); lp.connect(g); g.connect(dest); osc.start(t); osc.stop(t + dur + 0.05);
      });
    },
    scratchHit(ctx, t, dest) {
      const noise = ctx.createBufferSource(); noise.buffer = this.noiseBuffer(ctx, 0.5);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6;
      bp.frequency.setValueAtTime(400, t);
      bp.frequency.linearRampToValueAtTime(2200, t + 0.12);
      bp.frequency.linearRampToValueAtTime(300, t + 0.28);
      bp.frequency.linearRampToValueAtTime(1800, t + 0.42);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.48);
      noise.connect(bp); bp.connect(g); g.connect(dest); noise.start(t); noise.stop(t + 0.5);
    },
    tomHit(ctx, t, dest, pitch = 180) {
      const osc = ctx.createOscillator(); osc.type = 'sine';
      const g = ctx.createGain();
      osc.frequency.setValueAtTime(pitch, t);
      osc.frequency.exponentialRampToValueAtTime(pitch * 0.55, t + 0.22);
      g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t + 0.3);
    },
    rimHit(ctx, t, dest) {
      const osc = ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = 1400;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
      osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t + 0.05);
      const noise = ctx.createBufferSource(); noise.buffer = this.noiseBuffer(ctx, 0.04);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.3, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      noise.connect(hp); hp.connect(ng); ng.connect(dest); noise.start(t); noise.stop(t + 0.05);
    },
    shakerHit(ctx, t, dest) {
      const noise = ctx.createBufferSource(); noise.buffer = this.noiseBuffer(ctx, 0.09);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 6000; bp.Q.value = 0.6;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      noise.connect(bp); bp.connect(g); g.connect(dest); noise.start(t); noise.stop(t + 0.09);
    },
    cowbellHit(ctx, t, dest) {
      [800, 540].forEach((f) => {
        const osc = ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = f;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 3;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        osc.connect(bp); bp.connect(g); g.connect(dest); osc.start(t); osc.stop(t + 0.3);
      });
    },
    rideHit(ctx, t, dest) {
      const noise = ctx.createBufferSource(); noise.buffer = this.noiseBuffer(ctx, 0.6);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000;
      const bell = ctx.createBiquadFilter();
      bell.type = 'peaking'; bell.frequency.value = 8000; bell.Q.value = 2; bell.gain.value = 6;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      noise.connect(hp); hp.connect(bell); bell.connect(g); g.connect(dest);
      noise.start(t); noise.stop(t + 0.6);
    },
    arpNote(ctx, t, dur, dest, freq) {
      const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = freq;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.setValueAtTime(3500, t);
      lp.frequency.exponentialRampToValueAtTime(600, t + Math.max(0.03, dur * 0.9));
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.3, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(lp); lp.connect(g); g.connect(dest); osc.start(t); osc.stop(t + dur + 0.02);
    },
    padVoice(ctx, t, dur, dest, freqs) {
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator(); osc.type = i % 2 ? 'triangle' : 'sawtooth';
        osc.frequency.value = f * (1 + i * 0.002);
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.14, t + dur * 0.4);
        g.gain.linearRampToValueAtTime(0.0001, t + dur);
        osc.connect(lp); lp.connect(g); g.connect(dest); osc.start(t); osc.stop(t + dur + 0.05);
      });
    },
    bellNote(ctx, t, dur, dest, freq) {
      [1, 2.4, 3.8].forEach((mult, i) => {
        const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq * mult;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.28 / (i + 1), t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t + dur + 0.05);
      });
    },
    riserSweep(ctx, t, dur, dest) {
      const noise = ctx.createBufferSource(); noise.buffer = this.noiseBuffer(ctx, dur);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(300, t);
      bp.frequency.exponentialRampToValueAtTime(9000, t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + dur * 0.92);

   Used for one thing: fitting a loop to the project tempo *without* changing
   its pitch. Tempo sync normally rides on `playbackRate`, which is a tape
   speed change — correct for a sampler, wrong when you just want a 90 BPM loop

      let s = 0;

      const s = score(off);

      const s = score(off);

   * Stretch `buffer` so it plays `ratio` times slower (ratio > 1 = longer).
   * Pitch is preserved: the output is overlap-added, not resampled.

        const sample = sampleLibrary.get(clip.sampleId);
        if (!sample) return;
        const clipEnd = clip.startSix + (clip.trimEndSix - clip.trimStartSix);
        if (clipEnd <= startSix || clip.startSix >= endSix) return;
        NB.Schedule.clip(oac, buses[ti].gain, clip, sample, {
          when: NB.Schedule.when(clip, startSix, 0, bpm, project.swing || 0),
          fromSix: startSix, bpm, swing: project.swing || 0,
        });
      });
    });

    return { rendered: await oac.startRendering(), seconds: totalSec };
  }

  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  /* ---------------------------------------------------------------- stems
     Render each track on its own through the same master chain and bundle the
     WAVs into a store-only ZIP, so the whole thing stays dependency-free. */
  async function renderStems(opts) {
    const out = [];
    const tracks = opts.project.tracks;
    for (let i = 0; i < tracks.length; i++) {
      const t = tracks[i];
      if (!t.clips.length) continue;
      const { rendered } = await renderArrangement({ ...opts, loopOnly: false, soloTrack: i });
      out.push({ name: `${String(i + 1).padStart(2, '0')}-${slug(t.name)}.wav`, blob: encodeWAV(rendered) });
    }
    return out;
  }

  function slug(s) {
    return (s || 'track').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 32) || 'track';
  }

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /* ZIP with stored (uncompressed) entries — WAV data does not compress well
     and this keeps the writer to a few dozen lines. */
  async function zip(files) {
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;

    for (const f of files) {
      const nameBytes = enc.encode(f.name);
      const data = new Uint8Array(await f.blob.arrayBuffer());
      const crc = crc32(data);

      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0, true);
      local.setUint16(8, 0, true);          // method: store
      local.setUint16(10, 0, true);         // time
      local.setUint16(12, 0x21, true);      // date (1980-01-01)
      local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true);
      local.setUint32(22, data.length, true);
      local.setUint16(26, nameBytes.length, true);
      local.setUint16(28, 0, true);

      parts.push(new Uint8Array(local.buffer), nameBytes, data);

      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true);
      cd.setUint16(6, 20, true);
      cd.setUint16(8, 0, true);
      cd.setUint16(10, 0, true);
      cd.setUint16(12, 0, true);
      cd.setUint16(14, 0x21, true);
      cd.setUint32(16, crc, true);
      cd.setUint32(20, data.length, true);
      cd.setUint32(24, data.length, true);
      cd.setUint16(28, nameBytes.length, true);
      cd.setUint16(30, 0, true);
      cd.setUint16(32, 0, true);
      cd.setUint16(34, 0, true);
      cd.setUint16(36, 0, true);
      cd.setUint32(38, 0, true);
      cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer), nameBytes);

      offset += 30 + nameBytes.length + data.length;
    }

    const centralSize = central.reduce((n, a) => n + a.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);

    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
  }

  NB.Wav = { encodeWAV, renderArrangement, renderStems, zip, download, tailSeconds, slug };
})(window.NB = window.NB || {});

</script>
<script>
/* =========================================================================
   NEONBOOM · core/project.js
   Sample registry, project state, track/clip operations, undo+redo history,
   IndexedDB autosave, project file import/export and the demo arrangement.
   ========================================================================= */
(function (NB) {
  'use strict';
  const { uid, deepClone, clamp, TRACK_COLORS, REF_BPM, SIX_PER_BAR } = NB.util;

  /* ------------------------------------------------------------------ bus */
  const bus = {
    _h: {},
    on(evt, fn) { (this._h[evt] = this._h[evt] || []).push(fn); return fn; },
    emit(evt, data) { (this._h[evt] || []).forEach((fn) => { try { fn(data); } catch (e) { console.warn(e); } }); },
  };

  /* -------------------------------------------------------------- library */
  const Library = {
    items: new Map(),

    register({ id: fixedId, name, buffer, category, color, refBpm = REF_BPM, isUser = false, rawBytes = null, beats = null }) {
      /* Procedural loops pass a stable id (loop_<generator>) so a saved
         project resolves its clips again after a reload. Imported samples
         get a fresh unique id each session and are remapped on load. */
      const id = fixedId || uid('smp');
      const computedBeats = beats != null ? beats : buffer.duration / (60 / refBpm);
      this.items.set(id, {
        id, name, buffer, category, color, refBpm, isUser, rawBytes,
        beats: Math.max(0.25, computedBeats),
        peaks: computePeaks(buffer),
      });
      return id;
    },
    get(id) { return this.items.get(id); },
    has(id) { return this.items.has(id); },
    list() { return Array.from(this.items.values()); },
    byName(name) { return this.list().find((s) => s.name === name) || null; },
    categories() { return Array.from(new Set(this.list().map((s) => s.category))); },
  };

  function computePeaks(buffer, buckets = 400) {
    const ch0 = buffer.getChannelData(0);
    const ch1 = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : ch0;
    const step = Math.max(1, Math.floor(buffer.length / buckets));
    const peaks = new Float32Array(buckets);
    for (let b = 0; b < buckets; b++) {
      let max = 0;
      const start = b * step, end = Math.min(buffer.length, start + step);
      for (let i = start; i < end; i++) {
        const v = Math.max(Math.abs(ch0[i]), Math.abs(ch1[i]));
        if (v > max) max = v;
      }
      peaks[b] = max;
    }
    return peaks;
  }

  /* -------------------------------------------------------------- project */
  const DEFAULT_TRACKS = 8;

  function newTrack(i) {
    return {
      id: uid('trk'), name: `Track ${i + 1}`,
      color: NB.util.paletteColor(i),
      vol: 0.85, pan: 0, sendA: 0, sendB: 0, mute: false, solo: false, clips: [],
      automation: { level: [], pan: [], sendA: [], sendB: [] },  // [{six, v}], sorted
      autoMode: null,                          // 'level' | 'pan' | null (lane shown)
    };
  }

  const Project = {
    name: 'Untitled beat',
    bpm: 90,
    snap: 2,                       // sixteenths per snap step
    loopIn: 0, loopOut: SIX_PER_BAR * 4, loopEnabled: false,
    swing: 0,                       // 0-0.6, delays every second 16th
    tracks: [],
    metronome: false,
    scenes: [],
    fx: null,                       // last FX rack values (restored on boot)
  };

  function initTracks(n = DEFAULT_TRACKS) {
    Project.tracks = Array.from({ length: n }, (_, i) => newTrack(i));
  }

  function newClip(sampleId, trackId, startSix) {
    const s = Library.get(sampleId);
    const lengthSix = Math.max(1, Math.round((s ? s.beats : 1) * 4));
    return { id: uid('clp'), sampleId, trackId, startSix,
      lengthSix, trimStartSix: 0, trimEndSix: lengthSix, gain: 1,
      pitch: 0, reverse: false, fadeIn: 0, fadeOut: 0, stretch: false };
  }

  /* Older projects (and the demo builder) create clips by hand, so normalise
     the optional fields once on load instead of guarding at every call site. */
  function normaliseClip(c) {
    c.gain = c.gain == null ? 1 : c.gain;
    c.pitch = c.pitch || 0;
    c.reverse = !!c.reverse;
    c.fadeIn = c.fadeIn || 0;
    c.fadeOut = c.fadeOut || 0;
    c.stretch = !!c.stretch;
    return c;
  }

  /* Reversed playback needs a reversed copy of the buffer; build it once per
     sample and keep it on the sample object. */
  function reversedBuffer(sample) {
    if (sample._revBuffer) return sample._revBuffer;
    const src = sample.buffer;
    const out = new AudioBuffer({ numberOfChannels: src.numberOfChannels, length: src.length, sampleRate: src.sampleRate });
    for (let ch = 0; ch < src.numberOfChannels; ch++) {
      const a = src.getChannelData(ch);
      const b = out.getChannelData(ch);
      for (let i = 0, n = a.length; i < n; i++) b[i] = a[n - 1 - i];
    }
    sample._revBuffer = out;
    return out;
  }

  function clipEnd(clip) { return clip.startSix + (clip.trimEndSix - clip.trimStartSix); }

  /* ---- automation ------------------------------------------------------
     A breakpoint envelope per track. Values are multipliers: `level` scales
     the track (0 = silent, 1 = as the fader says), `pan` overrides the pan
     knob. With no points the envelope is flat and the knobs win. */
  const AUTOMATION_RANGE = { level: [0, 1], pan: [-1, 1], sendA: [0, 1], sendB: [0, 1] };

  function autoValueAt(track, kind, six) {
    const pts = (track.automation && track.automation[kind]) || [];
    if (!pts.length) return null;
    if (six <= pts[0].six) return pts[0].v;
    const last = pts[pts.length - 1];
    if (six >= last.six) return last.v;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      if (six >= a.six && six <= b.six) {
        const t = (six - a.six) / Math.max(1e-6, b.six - a.six);
        return a.v + (b.v - a.v) * t;
      }
    }
    return last.v;
  }

  function autoPoint(track, kind, six, v) {
    const [min, max] = AUTOMATION_RANGE[kind];
    if (!track.automation) track.automation = { level: [], pan: [], sendA: [], sendB: [] };
    const pts = track.automation[kind] || (track.automation[kind] = []);
    const value = clamp(v, min, max);
    const at = Math.max(0, Math.round(six));
    const existing = pts.findIndex((p) => Math.abs(p.six - at) < 1);
    if (existing >= 0) pts[existing].v = value;
    else pts.push({ six: at, v: value });
    pts.sort((a, b) => a.six - b.six);
    return pts;
  }

  function autoRemove(track, kind, six) {
    const pts = (track.automation && track.automation[kind]) || [];
    const i = pts.findIndex((p) => Math.abs(p.six - six) < 2);
    if (i >= 0) pts.splice(i, 1);
    return i >= 0;
  }

  function addTrack() {
    const t = newTrack(Project.tracks.length);
    Project.tracks.push(t);
    return t;
  }
  function removeTrack(id) {
    const i = Project.tracks.findIndex((t) => t.id === id);
    if (i < 0 || Project.tracks.length <= 1) return false;
    Project.tracks.splice(i, 1);
    return true;
  }
  function findClip(clipId) {
    for (const t of Project.tracks) {
      const c = t.clips.find((x) => x.id === clipId);
      if (c) return { clip: c, track: t };
    }
    return null;
  }
  function removeClip(clipId) {
    let hit = false;
    Project.tracks.forEach((t) => {
      const n = t.clips.length;
      t.clips = t.clips.filter((c) => c.id !== clipId);
      if (t.clips.length !== n) hit = true;
    });
    return hit;
  }

  /* -------------------------------------------------------------- history */
  const History = {
    undoStack: [], redoStack: [], labels: [], limit: 80,
    snapshot() {
      return JSON.stringify({
        bpm: Project.bpm, snap: Project.snap,
        loopIn: Project.loopIn, loopOut: Project.loopOut, loopEnabled: Project.loopEnabled,
        name: Project.name, tracks: Project.tracks,
      });
    },
    push(label) {
      this.undoStack.push(this.snapshot());
      this.labels.push(label || 'Edit');
      if (this.undoStack.length > this.limit) { this.undoStack.shift(); this.labels.shift(); }
      this.redoStack.length = 0;
      bus.emit('history', { canUndo: this.canUndo(), canRedo: false });
    },

    /* Human-readable list, newest first, for the history panel. */
    list() {
      return this.undoStack.map((_, i) => ({
        index: i,
        label: this.labels[i] || 'Edit',
        stepsBack: this.undoStack.length - i,
      })).reverse();
    },

    /* Rewind to the state *before* entry i (and drop everything after it). */
    jumpTo(i) {
      if (i < 0 || i >= this.undoStack.length) return false;
      this.redoStack.push(this.snapshot());
      this.apply(this.undoStack[i]);
      this.undoStack.length = i;
      this.labels.length = i;
      bus.emit('history', { canUndo: this.canUndo(), canRedo: true });
      bus.emit('project:replaced');
      return true;
    },
    apply(json) {
      const s = JSON.parse(json);
      Project.bpm = s.bpm; Project.snap = s.snap;
      Project.loopIn = s.loopIn; Project.loopOut = s.loopOut;
      Project.loopEnabled = s.loopEnabled; Project.name = s.name || Project.name;
      Project.tracks = s.tracks;
    },
    undo() {
      if (!this.undoStack.length) return false;
      this.redoStack.push(this.snapshot());
      this.apply(this.undoStack.pop());
      this.labels.pop();
      bus.emit('history', { canUndo: this.canUndo(), canRedo: true });
      bus.emit('project:replaced');
      return true;
    },
    redo() {
      if (!this.redoStack.length) return false;
      this.undoStack.push(this.snapshot());
      this.apply(this.redoStack.pop());
      bus.emit('history', { canUndo: true, canRedo: this.canRedo() });
      bus.emit('project:replaced');
      return true;
    },
    /* commit a snapshot captured BEFORE an interaction started (lazy push:
       a drag that never moved should not pollute the history). */
    commit(json, label) {
      if (!json) return;
      this.undoStack.push(json);
      this.labels.push(label || 'Edit');
      if (this.undoStack.length > this.limit) { this.undoStack.shift(); this.labels.shift(); }
      this.redoStack.length = 0;
      bus.emit('history', { canUndo: true, canRedo: false });
    },
    canUndo() { return this.undoStack.length > 0; },
    canRedo() { return this.redoStack.length > 0; },
  };

  /* ---------------------------------------------------------- persistence */
  const Persistence = {
    db: null, timer: 0, enabled: false,

    open() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('no indexedDB'));
        const req = indexedDB.open('neonboomDB', 3);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('project')) db.createObjectStore('project', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('samples')) db.createObjectStore('samples', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('loops')) db.createObjectStore('loops', { keyPath: 'id' });
        };
        req.onsuccess = () => { this.db = req.result; this.enabled = true; resolve(); };
        req.onerror = () => reject(req.error);
      });
    },

    saveSoon() {
      if (!this.enabled) return;
      bus.emit('saving');
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.save(), 650);
    },

    async save() {
      if (!this.db) return false;
      try {
        const tx = this.db.transaction(['project', 'samples'], 'readwrite');
        tx.objectStore('project').put({
          id: 'current', name: Project.name, bpm: Project.bpm, snap: Project.snap,
          loopIn: Project.loopIn, loopOut: Project.loopOut, loopEnabled: Project.loopEnabled,
          metronome: Project.metronome, swing: Project.swing, fx: Project.fx || null,
          scenes: Project.scenes || [],
          userSampleCount: Library.list().filter((x) => x.isUser).length,
          tracks: Project.tracks, savedAt: Date.now(),
        });
        Library.list().forEach((s) => {
          if (s.isUser && s.rawBytes) {
            tx.objectStore('samples').put({
              id: s.id, name: s.name, category: s.category, color: s.color,
              refBpm: s.refBpm, bytes: s.rawBytes,
            });
          }
        });
        await new Promise((res) => { tx.oncomplete = res; tx.onerror = res; tx.onabort = res; });
        bus.emit('saved', new Date());
        return true;
      } catch (err) {
        console.warn('autosave failed (non-fatal):', err);
        return false;
      }
    },

    async load(engine) {
      if (!this.db) return false;
      const read = (store, fn) => new Promise((res) => {
        try {
          const tx = this.db.transaction(store, 'readonly');
          const rq = fn(tx.objectStore(store));
          rq.onsuccess = () => res(rq.result);
          rq.onerror = () => res(null);
        } catch (e) { res(null); }
      });
      const proj = await read('project', (s) => s.get('current'));
      /* skip the sample store entirely when the project has no imports —
         it is a second transaction and, on a cold profile, a slow one */
      const samples = proj && proj.userSampleCount > 0
        ? ((await read('samples', (s) => s.getAll())) || [])
        : [];

      const idMap = {};
      for (const s of samples) {
        try {
          const buf = await engine.ctx.decodeAudioData(s.bytes.slice(0));
          idMap[s.id] = Library.register({
            name: s.name, buffer: buf, category: s.category || 'Imported',
            color: s.color || TRACK_COLORS[0], refBpm: s.refBpm || REF_BPM,
            isUser: true, rawBytes: s.bytes,
          });
        } catch (e) { console.warn('sample restore failed', s.name, e); }
      }
      if (!proj || !Array.isArray(proj.tracks)) return false;

      Project.name = proj.name || Project.name;
      Project.bpm = proj.bpm || 90;
      Project.snap = proj.snap || 2;
      Project.loopIn = proj.loopIn || 0;
      Project.loopOut = proj.loopOut || SIX_PER_BAR * 4;
      Project.loopEnabled = !!proj.loopEnabled;
      Project.metronome = !!proj.metronome;
      Project.swing = proj.swing || 0;
      /* Scenes hold their own copies of tracks, so they need the same sample-id
         remap and clip normalisation the live tracks get — otherwise a scene
         captured with an imported sample points at an id that no longer exists
         after the reload, and launching it plays silence. */
      const remapClips = (clips) => (clips || [])
        .map((c) => normaliseClip({ ...c, sampleId: idMap[c.sampleId] || c.sampleId }))
        .filter((c) => Library.items.has(c.sampleId));
      Project.scenes = (Array.isArray(proj.scenes) ? proj.scenes : []).map((sc) => ({
        ...sc,
        tracks: (sc.tracks || []).map((t) => ({ ...t, clips: remapClips(t.clips) })),
      }));
      Project.fx = proj.fx || null;
      Project.tracks = proj.tracks.map((t) => ({
        ...t,
        clips: (t.clips || [])
          .map((c) => normaliseClip({ ...c, sampleId: idMap[c.sampleId] || c.sampleId }))
          .filter((c) => Library.items.has(c.sampleId)),
      }));
      return true;
    },

    async clear() {
      if (!this.db) return;
      const tx = this.db.transaction(['project', 'samples'], 'readwrite');
      tx.objectStore('project').clear();
      tx.objectStore('samples').clear();
    },
  };

  /* ------------------------------------------------------------ loop cache
     The 27 procedural loops cost ~2 s to synthesise. They are deterministic,
     so the rendered PCM is cached in IndexedDB as 16-bit and re-hydrated on
     the next visit: a warm start is a memory copy, not a synthesis run.
     Bump SYNTH_VERSION whenever a generator changes. */
  const SYNTH_VERSION = 1;

  const LoopCache = {
    key(name) { return `${name}@v${SYNTH_VERSION}@${REF_BPM}`; },

    /* Read only the rows we need for the first paint. */
    async many(names) {
      const map = new Map();
      if (!Persistence.db || !names.length) return map;
      await new Promise((res) => {
        try {
          const tx = Persistence.db.transaction('loops', 'readonly');
          const store = tx.objectStore('loops');
          let left = names.length;
          names.forEach((n) => {
            const rq = store.get(this.key(n));
            rq.onsuccess = () => {
              if (rq.result) map.set(this.key(n), rq.result);
              if (--left === 0) res();
            };
            rq.onerror = () => { if (--left === 0) res(); };
          });
          tx.oncomplete = res;
          tx.onerror = res;
        } catch (e) { res(); }
      });
      return map;
    },

    async all() {
      if (!Persistence.db) return new Map();
      const rows = await new Promise((res) => {
        try {
          const tx = Persistence.db.transaction('loops', 'readonly');
          const rq = tx.objectStore('loops').getAll();
          rq.onsuccess = () => res(rq.result || []);
          rq.onerror = () => res([]);
        } catch (e) { res([]); }
      });
      const map = new Map();
      rows.forEach((r) => map.set(r.id, r));
      return map;
    },

    /* Float32 → Int16 halves the storage and is inaudible for these loops.
       The generators are mono-compatible (no panners), so a duplicate channel
       is detected and stored once — another 2x off the cache and the read. */
    async put(name, buffer, beats) {
      if (!Persistence.db) return false;
      const len = buffer.length;
      const ch0 = buffer.getChannelData(0);
      const ch1 = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : null;
      let mono = true;
      if (ch1) {
        for (let i = 0; i < len; i += 257) {
          if (Math.abs(ch0[i] - ch1[i]) > 1e-6) { mono = false; break; }
        }
      }
      const channels = mono ? 1 : buffer.numberOfChannels;
      const data = new Int16Array(channels * len);
      for (let c = 0; c < channels; c++) {
        const src = c === 0 ? ch0 : buffer.getChannelData(c);
        const off = c * len;
        for (let i = 0; i < len; i++) {
          const v = Math.max(-1, Math.min(1, src[i]));
          data[off + i] = v < 0 ? v * 0x8000 : v * 0x7fff;
        }
      }
      try {
        const tx = Persistence.db.transaction('loops', 'readwrite');
        tx.objectStore('loops').put({
          id: this.key(name), name, beats, channels, length: len,
          sampleRate: buffer.sampleRate, data,
        });
        await new Promise((res) => { tx.oncomplete = res; tx.onerror = res; tx.onabort = res; });
        return true;
      } catch (e) { return false; }
    },

    hydrate(row, ctx) {
      /* cached mono rows are expanded back to stereo so every downstream
         assumption (peaks, reverse, export) stays the same */
      const outCh = Math.max(2, row.channels);
      const buf = ctx.createBuffer(outCh, row.length, row.sampleRate);
      const len = row.length;
      const data = row.data;
      for (let c = 0; c < outCh; c++) {
        const dst = buf.getChannelData(c);
        const off = (c % row.channels) * len;
