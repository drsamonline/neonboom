name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Standalone HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-standalone.mjs
      - name: Zip the source bundle
        run: zip -r neonboom-source.zip index.html manifest.webmanifest sw.js src assets docs scripts tests LICENSE README.md CREDITS.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/neonboom.html
            neonboom-source.zip
          generate_release_notes: true

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: web
    # Best effort: a signed installer needs each platform's own toolchain and
    # secrets. The web app is the product; these artifacts are a convenience and
    # must never block the release itself.
    continue-on-error: true
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-standalone.mjs
      - name: Stage the app into the shell
        shell: bash
        run: |
          mkdir -p electron/app
          cp dist/neonboom.html electron/app/
      - name: Package
        working-directory: electron
        run: |
          npm install
          npx electron-builder --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/**/*
          fail_on_unmatched_files: false
