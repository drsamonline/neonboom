name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install a known Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Install the harness
        run: npm install

      - name: Build the single-file bundle
        run: node scripts/build-standalone.mjs

      - name: Run the headless suite
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/run.mjs

      - name: Size budget (256 KB tripwire, not a target)
        # The single file is ~225 KB. This exists to catch runaway growth, so it
        # is deliberately loose: raising it is a decision, not a fix.
        run: |
          SIZE=$(stat -c%s dist/neonboom.html)
          echo "dist/neonboom.html = $SIZE bytes ($((SIZE/1024)) KB)"
          test "$SIZE" -lt 262144
