name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Standalone HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build deps
        run: npm ci
      - run: node scripts/build-standalone.mjs
      - name: Zip the source bundle
        run: zip -r neonboom-source.zip index.html manifest.webmanifest sw.js src assets docs scripts tests LICENSE README.md CREDITS.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/neonboom.html
            dist/neonboom.min.html
            pack/neonboom-pack-v1.zip
            neonboom-source.zip
          generate_release_notes: true

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: web
    # Best effort: a signed installer needs each platform's own toolchain and
    # secrets. The web app is the product; these artifacts are a convenience and
    # must never block the release itself.
    continue-on-error: true
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build deps
        run: npm ci
      - run: node scripts/build-standalone.mjs
      - name: Stage the app into the shell
        shell: bash
        run: |
          mkdir -p electron/app/pack
          cp dist/neonboom.html electron/app/index.html
          cp pack/neonboom-pack-v1.zip electron/app/pack/
          # the shell serves from file://, so tell the app the pack is bundled.
          # node, not sed: BSD sed on macOS wants -i '' and this has to be portable
          node -e "const fs=require('fs');const p='electron/app/index.html';const h=fs.readFileSync(p,'utf8');fs.writeFileSync(p,h.replace('<title>','<meta name=\"neonboom-pack-local\" content=\"1\">\n<title>'))"
          grep -c 'neonboom-pack-local' electron/app/index.html
      - name: Package
        working-directory: electron
        run: |
          npm install
          npx electron-builder --publish never
      - name: Collect installers only
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in electron/dist/*.exe electron/dist/*.dmg electron/dist/*.AppImage electron/dist/*.deb electron/dist/*.snap; do
            cp "$f" out/
          done
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: false
